<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: presenter deck — scene chips, a three-lane stage (counter screen · server · status), a dark narration band, a player bar. */
:root {
  --bg: #f3f5f1;
  --panel: #ffffff;
  --ink: #1b2a20;
  --muted: #5d6b61;
  --line: #d4dbd3;
  --green: #214d2f;
  --green-soft: #e3eee5;
  --accent: #4533ff;
  --warn: #b4232a;
  --warn-soft: #fdecec;
  --ok: #157a3a;
  --ok-soft: #e4f5e9;
  --amber: #8a5a00;
  --amber-soft: #fff4d6;
  --band: #14241a;
  --band-ink: #eef3ee;
  --screen: #f2f2f4;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --panel: #18211b; --ink: #e5ece6; --muted: #9aa89d; --line: #2c3a30;
    --green: #7fc493; --green-soft: #1d3324; --accent: #8c82ff;
    --warn: #ff8b8f; --warn-soft: #3a1c1e; --ok: #6fd896; --ok-soft: #173322;
    --amber: #f0c25a; --amber-soft: #3a2f12; --band: #0a110c; --band-ink: #eef3ee; --screen: #202a23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --panel: #18211b; --ink: #e5ece6; --muted: #9aa89d; --line: #2c3a30;
  --green: #7fc493; --green-soft: #1d3324; --accent: #8c82ff;
  --warn: #ff8b8f; --warn-soft: #3a1c1e; --ok: #6fd896; --ok-soft: #173322;
  --amber: #f0c25a; --amber-soft: #3a2f12; --band: #0a110c; --band-ink: #eef3ee; --screen: #202a23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 120px; display: grid; gap: 16px; }
header h1 { margin: 0; font-size: 22px; text-wrap: balance; color: var(--green); }
header p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-family: var(--mono); font-weight: 500; color: var(--muted); }
.chip[aria-current="step"] { background: var(--green); border-color: var(--green); color: var(--panel); }
.chip[aria-current="step"] b { color: var(--panel); }
.chip:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .8fr); gap: 12px; }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
.lane { background: var(--panel); border: 1px solid var(--line); padding: 12px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.lane h2 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.lane h2 span { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); }

/* ---- counter screen mock ---- */
.screen { position: relative; background: var(--screen); border: 1px solid var(--line); padding: 12px; min-height: 360px; font-size: 12px; overflow: hidden; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 8px; width: min(250px, 100%); display: grid; gap: 6px; }
.card .name { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; }
.card .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 6px; font: inherit; font-weight: 700; text-align: center; }
.btn.arrived { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.btn.dots { padding: 4px 8px; }
.btn.dots.on { border-color: var(--accent); }
.line { border: 1px solid var(--line); padding: 4px 6px; display: flex; justify-content: space-between; }
.menu { position: absolute; left: 150px; top: 112px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgb(0 0 0 / .15); min-width: 150px; padding: 4px 0; }
.menu div { padding: 5px 12px; display: flex; gap: 8px; }
.menu div small { margin-left: auto; color: var(--muted); font-size: 10px; }
.menu .del { color: var(--warn); }
.menu .del.press { background: var(--warn-soft); }
.gone { opacity: .35; text-decoration: line-through; }
.toast { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 10px; font-weight: 700; }
.toast.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
.toast.wait { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber); }

.veil { position: absolute; inset: 0; background: rgb(0 0 0 / .45); display: flex; align-items: center; justify-content: center; padding: 10px; }
.modal { background: var(--screen); border: 1px solid var(--line); width: 220px; max-width: 100%; color: var(--ink); }
.modal .top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 10px; }
.modal .top b { font-size: 13px; }
.modal .top p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
.modal .body { padding: 10px; display: grid; gap: 6px; }
.pinbox { height: 30px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); }
.pinbox.bad { border-color: var(--warn); }
.pinbox i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); display: block; }
.err { color: var(--warn); font-size: 11px; min-height: 14px; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.pad span { background: var(--panel); border: 1px solid var(--line); text-align: center; padding: 5px 0; font-weight: 700; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.acts span { border: 1px solid var(--line); text-align: center; padding: 5px; font-weight: 700; background: var(--panel); }
.acts .go { background: var(--accent); border-color: var(--accent); color: #fff; }
.acts .go.dim { opacity: .4; }

/* ---- server lane ---- */
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.log li { border: 1px solid var(--line); padding: 7px 8px; font-size: 12px; display: grid; gap: 2px; opacity: .38; transition: opacity .25s; }
.log li.seen { opacity: .75; }
.log li.now { opacity: 1; border-color: var(--green); background: var(--green-soft); }
.log .who { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.log code { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
.tag { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border: 1px solid currentColor; margin-right: 4px; }
.tag.r { color: var(--warn); }
.tag.g { color: var(--ok); }
.tag.a { color: var(--amber); }

/* ---- status lane ---- */
.facts { display: grid; gap: 8px; }
.fact { border: 1px solid var(--line); padding: 8px; display: grid; gap: 2px; }
.fact b { font-size: 12.5px; }
.fact span { color: var(--muted); font-size: 12px; }
.pill { justify-self: start; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.todo { background: var(--amber-soft); color: var(--amber); }
.pill.no { background: var(--warn-soft); color: var(--warn); }
.fact.hot { border-color: var(--green); }

/* ---- narration + player ---- */
.band { background: var(--band); color: var(--band-ink); padding: 14px 16px; display: grid; gap: 4px; min-height: 92px; }
.band .eyebrow { color: #9fb7a6; }
.band p { margin: 0; font-size: 15.5px; max-width: 80ch; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; z-index: 5; }
.bar button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; cursor: pointer; }
.bar .play { background: var(--green); color: var(--panel); border-color: var(--green); font-weight: 700; min-width: 92px; }
.bar .seg { display: inline-flex; }
.bar .seg button[aria-pressed="true"] { background: var(--green-soft); border-color: var(--green); font-weight: 700; }
.bar .count { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Pelham Hills · 0024 manager approval</div>

  </header>

  <nav class="chips" id="chips" aria-label="Scenes"></nav>

  <section class="stage">
    <div class="lane">
      <h2><span id="l1">계산대 화면</span><span>tee sheet</span></h2>
      <div class="screen" id="screen"></div>

  <section class="band" aria-live="polite">

</div>

<div class="bar">
  <button id="prev" type="button" aria-label="Previous scene">◀</button>

    <button type="button" data-lang="ko" aria-pressed="true">한국어</button>

  </span>
</div>

const $ = (id) => document.getElementById(id);

function card(opts) {
  return `<div class="card ${opts.gone ? "gone" : ""}">

  </div>`;
}
function modal(dots, bad) {
  const t = T[lang];
  return `<div class="veil"><div class="modal" role="presentation">
    <div class="top"><b>Manager approval</b><p>${t.modalMsg}</p></div>
    <div class="body">

  const t = T[lang];
  const menu = (press) => `<div class="menu"><div>☂ Raincheck <small>Manager</small></div><div>↺ Refund</div><div>▭ Mark unpaid <small>Manager</small></div><div class="del ${press ? "press" : ""}">🗑 Delete <small>Manager</small></div></div>`;
  switch (scene) {
    case 0: return card({ menu: true }) + menu(true);
    case 1: return card({}) + `<div class="toast wait">${t.toastWait}</div>`;
    case 2: return card({}) + modal(0, false);
    case 3: return card({}) + modal(4, false);
    case 4: return card({}) + modal(0, true);
    case 5: return card({ gone: true }) + `<div class="toast ok">✓ ${t.toastOk}</div>`;
    default: return card({ menu: true }) + menu(false);
  }
}
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("h1").textContent = t.h1; $("lede").textContent = t.lede;
  ["l1", "l2", "l3"].forEach((id, i) => ($(id).textContent = t.lanes[i]));
  $("chips").innerHTML = t.titles.map((title, i) =>
    `<button class="chip" type="button" data-i="${i}" ${i === scene ? 'aria-current="step"' : ""}><b>${i + 1}</b>${title}</button>`).join("");
  $("screen").innerHTML = screen();
  const upto = LOG_UPTO[scene];
  $("log").innerHTML = t.log.map((row, i) => {
    const cls = i < upto ? (i === upto - 1 && scene < 6 ? "now" : "seen") : "";
    return `<li class="${cls}"><span class="who">${row[0]}</span><b>${row[1]}</b><code>${row[2]}</code></li>`;
  }).join("");
  const hot = FACT_HOT[scene];
  $("facts").innerHTML = t.facts.map((f, i) => {
    const on = hot !== null && (Array.isArray(hot) ? hot.includes(i) : hot === i);
    return `<div class="fact ${on ? "hot" : ""}"><span class="pill ${f[2]}">${f[3]}</span><b>${f[0]}</b><span>${f[1]}</span></div>`;
  }).join("");
  $("sceneLabel").textContent = `${scene + 1} / 7 · ${t.titles[scene]}`;
  $("narr").textContent = t.narr[scene];
  $("count").textContent = `${scene + 1}/7`;
  $("play").textContent = playing ? t.pause : t.play;
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll("#speed button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.rate) === rate)));
}
function speak() {
  audio.src = `audio/${lang}-${scene + 1}.mp3`;
  audio.playbackRate = rate;
  audio.play().catch(() => { playing = false; render(); });
}
function go(i, keepPlaying = playing) {
  scene = Math.max(0, Math.min(6, i));
  playing = keepPlaying;
  render();
  if (playing) speak(); else audio.pause();
}
audio.addEventListener("ended", () => {
  if (!playing) return;
  if (scene < 6) setTimeout(() => playing && go(scene + 1, true), 500);
  else { playing = false; render(); }
});
$("play").onclick = () => { playing = !playing; render(); if (playing) speak(); else audio.pause(); };
$("prev").onclick = () => go(scene - 1);
$("next").onclick = () => go(scene + 1);
$("chips").onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) go(Number(b.dataset.i)); };
$("speed").innerHTML = [0.9, 1, 1.2].map((r) => `<button type="button" data-rate="${r}">${r}×</button>`).join("");
$("speed").onclick = (e) => { const b = e.target.closest("[data-rate]"); if (!b) return; rate = Number(b.dataset.rate); audio.playbackRate = rate; render(); };
$("lang").onclick = (e) => { const b = e.target.closest("[data-lang]"); if (!b) return; lang = b.dataset.lang; render(); if (playing) speak(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(scene + 1);
  else if (e.key === "ArrowLeft") go(scene - 1);
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); $("play").click(); }
});
render();
</script>

</body></html>
