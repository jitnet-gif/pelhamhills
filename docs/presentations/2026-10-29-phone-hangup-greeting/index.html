<script>
const NARR = {"ko": ["오늘 클럽 전화로 걸면, 손님 귀에 아무 소리도 나기 전에 영 초 만에 끊겼습니다. 트윌리오 기록의 삼일구이일 오류는, 소리를 넘기던 연결을 상대편, 즉 일레븐랩스가 닫았다는 뜻입니다.", "전화는 트윌리오를 거쳐 일레븐랩스 에이전트로 갑니다. 트윌리오는 잔액도 있고 연결도 정상이었습니다. 플라이 서버도 정상입니다. 문제는 일레븐랩스 에이전트가 전화를 받자마자 일 초 안에 닫은 데 있습니다.", "원인은 첫 인사말입니다. 첫 인사가 그리팅이라는 빈칸으로 되어 있었습니다. 웹사이트 찰리 버튼은 이 빈칸에 들어갈 인사를 보내지만, 전화는 아무것도 보내지 않습니다. 빈칸을 못 채우니 인사를 못 하고, 그래서 통화를 닫았습니다.", "왜 이렇게 됐을까요. 시월 이십육일, 웹 찰리와 전화가 같은 에이전트를 쓰게 하면서, 인사를 다르게 하려고 첫 인사를 빈칸으로 바꿨습니다. 전화용 문장은 기본값 칸에 넣었는데, 이 기본값은 대시보드 시험용일 뿐 실제 전화에는 채워지지 않습니다. 웹으로만 시험해서 전화 쪽을 놓쳤습니다. 제 설정 실수입니다.", "같은 에이전트에 직접 두 번 접속해 봤습니다. 인사 값을 보내면 정상으로 인사하고, 값을 빼면 일레븐랩스 기록과 똑같은 오류로 바로 끊깁니다. 크레딧이나 플라이, 트윌리오는 원인이 아닙니다.", "고치는 방법은 간단합니다. 대시보드의 첫 인사 칸을 전화 인사 문장으로 바꾸고 퍼블리시하면 전화는 바로 됩니다. 코드도 고쳐서, 웹은 찰리 인사로 덮어쓰게 했습니다. 순서가 중요합니다. 에이전트에서 덮어쓰기를 먼저 허용하고, 그다음 웹을 배포해야 합니다.", "예약 문자가 안 온 것은, 통화가 끊겨서 예약 자체가 만들어지지 않았을 가능성이 큽니다. 확정 문자는 예약이 확정된 뒤에만 나갑니다. 고친 뒤 다시 걸어 예약까지 해 보고, 그래도 안 오면 에스큐엘 결과의 오류를 확인하겠습니다."], "en": ["Today, calls to the club hung up after zero seconds, before the caller heard anything. Twilio error 31921 means the audio link was closed by the other side, which is ElevenLabs.", "A call goes through Twilio to the ElevenLabs agent. Twilio had a balance and handed the call over normally. The Fly server is fine too. The problem is that the ElevenLabs agent closed the call within one second.", "The cause is the first message. It was a blank called greeting. The website Charlie button sends a value for that blank, but a phone call sends nothing. The agent can't fill the blank, can't greet, and closes the call.", "Why did this happen? On October 26, web Charlie and the phone started sharing one agent. To greet differently, the first message became a blank. The phone sentence went into the placeholder default, but placeholders are only for dashboard testing, not real calls. Only the web was tested, so the phone gap was missed. That was my setup mistake.", "I connected to the same agent twice. With the greeting value, it greets normally. Without it, it drops right away with the same error ElevenLabs logged. Credits, Fly and Twilio are not the cause.", "The fix is simple. Put the phone greeting sentence in the dashboard's first message and publish, and calls work right away. The code now lets the web override it with Charlie's greeting. Order matters: allow the override on the agent first, then deploy the web.", "The missing booking text is most likely because the call dropped, so no booking was ever made. The confirmation text only goes out after a booking is confirmed. After the fix, we'll call and book again, and if no text arrives, check the error in the SQL result."]};
const DUR = {"ko": [12.43, 14.94, 15.31, 22.88, 14.21, 19.72, 15.28], "en": [10.95, 12.36, 11.83, 20.98, 11.94, 15.05, 15.83]};
let LANG = "ko";
try { const s = localStorage.getItem("pelham-deck-lang"); if (s === "en" || s === "ko") LANG = s; } catch (e) {}
const T = (o) => (typeof o === "string" ? o : o[LANG]);

const UI = {

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, playing = false, timer = null, startAt = 0;

function renderUI() {
  $("eyebrow").textContent = T(UI.eyebrow); $("title").textContent = T(UI.title); $("sub").textContent = T(UI.sub);
  $("who").textContent = T(UI.who); $("speedL").textContent = T(UI.speed); $("foot").textContent = T(UI.foot);
  $("play").textContent = playing ? T(UI.pause) : T(UI.play);
  $("lang-ko").setAttribute("aria-pressed", LANG === "ko"); $("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.documentElement.lang = LANG;
  $("chips").innerHTML = S.map((s, i) => `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}"><b>${i + 1}</b>${T(s.n)}</button>`).join("");
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $("stage").innerHTML = `<div class="lane"><div class="lt">${T(UI.pic)}</div><h2>${T(s.h)}</h2>${s.pic()}</div>
    <div class="lane"><div class="lt">${T(UI.keys)}</div><ul class="pts">${s.pts.map((p, k) => `<li><i>${k + 1}</i><span>${T(p)}</span></li>`).join("")}</ul></div>`;
  $("narr").textContent = NARR[LANG][cur];
  $("prog").style.width = "0";
  renderUI();
}

function stopAudio() { audio.pause(); clearInterval(timer); }
function playScene() {
  stopAudio();
  audio.src = `audio/${LANG}/s${cur + 1}.mp3`;
  audio.playbackRate = Number($("speed").value);
  const p = audio.play();
  if (p && p.catch) p.catch(() => { playing = false; renderUI(); });
  timer = setInterval(() => {
    const d = audio.duration || DUR[LANG][cur] || 1;
    $("prog").style.width = `${Math.min(100, (audio.currentTime / d) * 100)}%`;
  }, 200);
}
audio.addEventListener("ended", () => {
  clearInterval(timer); $("prog").style.width = "100%";
  if (playing && cur < S.length - 1) setTimeout(() => { if (playing) { show(cur + 1); playScene(); } }, 700);
  else { playing = false; renderUI(); }
});
$("play").onclick = () => { playing = !playing; if (playing) playScene(); else stopAudio(); renderUI(); };
$("prev").onclick = () => { show(cur - 1); if (playing) playScene(); };
$("next").onclick = () => { show(cur + 1); if (playing) playScene(); };
$("chips").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; show(Number(b.dataset.i)); if (playing) playScene(); };
$("speed").onchange = () => { audio.playbackRate = Number($("speed").value); };
function setLang(l) { LANG = l; try { localStorage.setItem("pelham-deck-lang", l); } catch (e) {} show(cur); if (playing) playScene(); }
$("lang-ko").onclick = () => setLang("ko");
$("lang-en").onclick = () => setLang("en");
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); });
show(0);
</script>
