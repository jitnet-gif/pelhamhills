<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;

:root[data-theme="dark"]{

  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}

.sub{color:var(--muted);font-size:13px}

.chip b{font-family:var(--mono);font-size:12px;color:var(--muted)}

.lane h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}

@media (max-width:560px){.eg-row{grid-template-columns:84px minmax(0,1fr) 60px;font-size:11.5px}}

.eg-track{height:16px;background:var(--bg);border:1px solid var(--line)}

.eg-tick{display:flex;gap:3px;flex-wrap:wrap}

.eg-math{font:700 14px var(--mono);border:1px dashed var(--line);padding:8px;text-align:center}
.eg-levers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.eg-levers{grid-template-columns:minmax(0,1fr)}}
.eg-lv{border:1px solid var(--line);background:var(--panel);padding:10px;display:grid;gap:4px;font-size:13px}
.eg-lv b{font-size:15px}
.eg-lv small{color:var(--muted)}
.eg-lv .tag{justify-self:start}
.eg-lv.pick{border:2px solid var(--green)}
.eg-check{display:grid;gap:8px}
.eg-check div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);padding:10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.lane{animation:in .35s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<script>
const NARR = {"ko": ["먼저 현황입니다. 이번 달 한도를 넘긴 건 저장량이 아니라 전송량, 즉 Egress 입니다. 무료 한도 5기가의 두 배가 넘는 11.45기가가 나갔습니다. 데이터베이스는 112메가로 여유가 있습니다. 10월 18일부터 갑자기 늘어 23일에는 하루 2.27기가까지 나갔고, 오늘 Pro 로 결제해서 차단은 풀렸습니다.", "어디서 나갔는지 API 기록을 보니 하나가 압도적입니다. 직원 티 시트 화면이 예약 목록을 하루 19,186번 읽었습니다. 다른 것들은 수백에서 수천 번이고, 대부분 비어 있는 응답이라 크기가 작습니다. 호출 수와 전송량이 같이 오르내려서, 한 번에 약 100킬로바이트씩 내려받는 것으로 봅니다.", "코드를 열어 보니 이유가 바로 보입니다. 티 시트는 5초마다 이번 주 7일치 예약을 통째로 다시 읽습니다. 바뀐 게 없어도 1분에 열두 번입니다. 10월 21일에 넣은 비교 시트를 열면 두 배가 되고, PC 와 탭마다 따로 돕니다. 화면 하나를 열두 시간 켜 두면 하루 약 0.86기가입니다.", "줄이는 손잡이는 네 가지입니다. 덜 자주 읽기, 바뀐 것만 받기, 덜 많이 받기, 그리고 서버가 밀어주기입니다. 추천은 첫째와 둘째를 함께 하는 것입니다. 하루 안에 끝나는 크기이고 효과가 가장 큽니다. 나머지 둘은 그래도 부족할 때 꺼냅니다.", "1단계는 덜 자주 읽기입니다. 5초를 30초로 늘리고, 2분 동안 손을 안 대면 60초로 늦춥니다. 내가 저장하거나 결제하면 내 화면은 지금처럼 바로 새로 읽습니다. 다른 PC 나 전화, 웹 예약만 최대 30초 늦게 보입니다. 이것만으로 약 83퍼센트가 줄어듭니다.", "2단계는 바뀌었을 때만 통째로 받는 방법입니다. 5초마다 예약 수와 마지막 수정 시각만 담은 아주 작은 변경 도장을 묻고, 도장이 달라졌을 때만 일주일치를 내려받습니다. 홀드는 시간이 지나면 저절로 사라지니 만료 시각도 도장에 넣습니다. 반응 속도는 그대로이고, 1단계와 합치면 98퍼센트 이상 줄어듭니다.", "함께 손볼 곳도 있습니다. 비교 시트가 왼쪽과 같은 주를 보면 결과를 나눠 쓰고, 스타터 화면에도 같은 도장을 씁니다. Fly 서버 워커들은 1분 간격에 응답이 거의 비어 있어서 그대로 둡니다. 지출 상한은 켜 두고, 일주일에 한 번 사용량 화면을 확인합니다.", "정리하면, 최고일 기준 하루 2.27기가가 1단계만으로 0.38기가, 두 단계를 합치면 약 0.04기가로 줄어듭니다. 추정치이지만 무료 한도 안으로도 돌아올 수 있는 수준입니다. 결제와 원인 찾기는 끝났고, 진행을 승인해 주시면 코드와 SQL 한 개를 준비하겠습니다."], "en": ["First, where we stand. What went over the limit this month isn't storage, it's transfer, called egress. 11.45 gigabytes went out, more than twice the free 5 gigabyte limit. The database is only 112 megabytes. It jumped from October 18th, peaked at 2.27 gigabytes on the 23rd, and paying for Pro today lifted the block.", "The API logs show one clear culprit. The staff tee sheet read the booking list 19,186 times in a day. Everything else is hundreds to a few thousand calls, mostly empty replies. Calls and egress rise and fall together, so each read is about 100 kilobytes.", "The code shows why. Every 5 seconds the tee sheet re-reads a whole week of bookings, twelve times a minute, even when nothing changed. Opening the second sheet added on October 21st doubles it, and every PC and tab polls on its own. One screen open for twelve hours is about 0.86 gigabytes a day.", "There are four levers: read less often, fetch only on change, fetch less data, and let the server push. The recommendation is the first two together. It's a one-day job with the biggest effect. The other two are for later, only if needed.", "Step one: read less often. Go from 5 seconds to 30, and slow to 60 when nobody has touched the screen for two minutes. Your own save or payment still refreshes your screen right away. Only other PCs, phone and web bookings show up to 30 seconds later. That alone cuts about 83 percent.", "Step two: full reload only on change. Every 5 seconds, ask for a tiny change stamp with the booking count and the latest edit time, and download the week only when the stamp changes. Holds expire on their own, so the stamp includes the earliest expiry too. It feels just as fast, and with step one it cuts 98 percent or more.", "A few related spots. If the second sheet shows the same week as the left, share the result, and the starter screen gets the same stamp. The Fly server workers poll once a minute with near-empty replies, so leave them. Keep the spend cap on, and check the usage page once a week.", "In short, the peak day's 2.27 gigabytes drops to 0.38 with step one, and to about 0.04 with both. These are estimates, but low enough to fit even the free limit again. Payment and diagnosis are done. With your OK, I'll prepare the code and one SQL file."]};
const DUR = {"ko": [22.83, 20.66, 21.21, 18.16, 18.76, 21.97, 17.03, 20.56], "en": [21.81, 17.14, 18.1, 14.47, 19.3, 20.92, 15.73, 18.0]};
let LANG = "ko";
try { const s = localStorage.getItem("pelham-deck-lang"); if (s === "en" || s === "ko") LANG = s; } catch (e) {}
const T = (o) => (typeof o === "string" ? o : o[LANG]);

const UI = {

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, playing = false, timer = null, startAt = 0;

function renderUI() {
  $("eyebrow").textContent = T(UI.eyebrow); $("title").textContent = T(UI.title); $("sub").textContent = T(UI.sub);
  $("who").textContent = T(UI.who); $("speedL").textContent = T(UI.speed); $("foot").textContent = T(UI.foot);
  $("play").textContent = playing ? T(UI.pause) : T(UI.play);
  $("lang-ko").setAttribute("aria-pressed", LANG === "ko"); $("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.documentElement.lang = LANG;
  $("chips").innerHTML = S.map((s, i) => `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}"><b>${i + 1}</b>${T(s.n)}</button>`).join("");
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $("stage").innerHTML = `<div class="lane"><div class="lt">${T(UI.pic)}</div><h2>${T(s.h)}</h2>${s.pic()}</div>
    <div class="lane"><div class="lt">${T(UI.keys)}</div><ul class="pts">${s.pts.map((p, k) => `<li><i>${k + 1}</i><span>${T(p)}</span></li>`).join("")}</ul></div>`;
  $("narr").textContent = NARR[LANG][cur];
  $("prog").style.width = "0";
  renderUI();
}

function stopAudio() { audio.pause(); clearInterval(timer); }
function playScene() {
  stopAudio();
  audio.src = `audio/${LANG}/s${cur + 1}.mp3`;
  audio.playbackRate = Number($("speed").value);
  const p = audio.play();
  if (p && p.catch) p.catch(() => { playing = false; renderUI(); });
  timer = setInterval(() => {
    const d = audio.duration || DUR[LANG][cur] || 1;
    $("prog").style.width = `${Math.min(100, (audio.currentTime / d) * 100)}%`;
  }, 200);
}
audio.addEventListener("ended", () => {
  clearInterval(timer); $("prog").style.width = "100%";
  if (playing && cur < S.length - 1) setTimeout(() => { if (playing) { show(cur + 1); playScene(); } }, 700);
  else { playing = false; renderUI(); }
});
$("play").onclick = () => { playing = !playing; if (playing) playScene(); else stopAudio(); renderUI(); };
$("prev").onclick = () => { show(cur - 1); if (playing) playScene(); };
$("next").onclick = () => { show(cur + 1); if (playing) playScene(); };
$("chips").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; show(Number(b.dataset.i)); if (playing) playScene(); };
$("speed").onchange = () => { audio.playbackRate = Number($("speed").value); };
function setLang(l) { LANG = l; try { localStorage.setItem("pelham-deck-lang", l); } catch (e) {} show(cur); if (playing) playScene(); }
$("lang-ko").onclick = () => setLang("ko");
$("lang-en").onclick = () => setLang("en");
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); });
show(0);
</script>
