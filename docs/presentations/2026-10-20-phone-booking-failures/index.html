<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Booking Failures</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: presenter bar (scenes + controls + language) over a dark narration band, then a three-lane stage — register screen · behind the scenes · register state. */
:root{
  --bg:#EEF2EC; --paper:#FFFFFF; --ink:#15211B; --muted:#5B6B62; --line:#D6DED5; --sunk:#F5F7F3;
  --green:#1E5A3F; --green-soft:#E1EDE5; --flag:#D4572A; --flag-soft:#FBE5DB;
  --violet:#4533FF; --violet-soft:#ECEAFF; --blue:#2D5E8C; --blue-soft:#E2ECF5;
  --sand:#9C7424; --sand-soft:#F5EDDC; --ok:#2F7D4F; --ok-soft:#E0F1E6;
  --term:#14201A; --term-ink:#DDE8E0; --term-key:#8FD3AE; --term-str:#F2C48B; --term-dim:#7F9489; --term-track:#2E3F35;
  /* the depicted POS screen keeps its real light look in both themes */
  --scr-bg:#F2F2F4; --scr-paper:#FFFFFF; --scr-ink:#1F2328; --scr-muted:#6B7280; --scr-line:#D4D4D8; --scr-bar:#111315; --scr-accent:#4533FF; --scr-accent-soft:#F4F3FF; --scr-red:#8A1F1F; --scr-red-soft:#FDF0F0; --scr-ok:#1F6B3A; --scr-ok-soft:#E6F4EA;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1511; --paper:#162019; --ink:#E6ECE7; --muted:#9AAA9F; --line:#2A3830; --sunk:#111A15;
    --green:#6BC196; --green-soft:#1B3127; --flag:#F08A5D; --flag-soft:#3A2219;
    --violet:#A99FFF; --violet-soft:#241F44; --blue:#7AAEDB; --blue-soft:#182A3A;
    --sand:#D9B566; --sand-soft:#2E2715; --ok:#6BCB8E; --ok-soft:#173222;
    --term:#0A110D; --term-ink:#D6E2DA; --term-key:#8FD3AE; --term-str:#F2C48B; --term-dim:#6E8277; --term-track:#22302A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1511; --paper:#162019; --ink:#E6ECE7; --muted:#9AAA9F; --line:#2A3830; --sunk:#111A15;
  --green:#6BC196; --green-soft:#1B3127; --flag:#F08A5D; --flag-soft:#3A2219;
  --violet:#A99FFF; --violet-soft:#241F44; --blue:#7AAEDB; --blue-soft:#182A3A;
  --sand:#D9B566; --sand-soft:#2E2715; --ok:#6BCB8E; --ok-soft:#173222;
  --term:#0A110D; --term-ink:#D6E2DA; --term-key:#8FD3AE; --term-str:#F2C48B; --term-dim:#6E8277; --term-track:#22302A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:20px 40px}
.app{max-width:1440px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:grid;gap:4px;min-width:0}
.top h1{font-size:clamp(22px,3vw,30px);font-weight:700}
.top h1 b{color:var(--violet)}
.top .lede{color:var(--muted);max-width:72ch;font-size:13.5px}

.scen{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip .ph{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:4px}
.ph.look{background:var(--green-soft);color:var(--green)}
.ph.count{background:var(--violet-soft);color:var(--violet)}
.ph.save{background:var(--blue-soft);color:var(--blue)}
.ph.home{background:var(--green-soft);color:var(--green)}
.ph.sale{background:var(--violet-soft);color:var(--violet)}
.ph.refund{background:var(--flag-soft);color:var(--flag)}
.ph.reg{background:var(--blue-soft);color:var(--blue)}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--paper)}
.chip[aria-pressed="true"] .no{color:var(--paper);opacity:.8}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;height:36px;min-width:36px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.play{background:var(--flag);border-color:var(--flag);color:#fff;min-width:150px;font-size:14px}
.btn svg{width:14px;height:14px;fill:currentColor}
.sep{width:1px;height:26px;background:var(--line)}
.lbl{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;height:34px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg.lang button{padding:0 14px}
.seg.lang button[aria-checked="true"]{background:var(--violet);color:#fff}
.seg.speed button{font-family:var(--mono)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
.tog input{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.tog input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:left .15s}
.tog input:checked{background:var(--green)}
.tog input:checked::after{left:16px}
.spacer{flex:1}
.voice{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--violet-soft);color:var(--violet);font-family:var(--mono);white-space:nowrap}

.cap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--term);color:var(--term-ink);border-radius:12px;padding:14px 18px}
.stepno{font-family:var(--mono);font-size:12px;color:var(--term-key);border:1px solid var(--term-dim);border-radius:6px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap p{font-size:clamp(15px,1.6vw,18px);font-weight:500;line-height:1.6;min-height:3.2em}
.cap .who{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--term-dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.eq{display:inline-flex;gap:2px;align-items:center;height:12px}
.eq i{width:3px;height:4px;border-radius:2px;background:var(--term-key)}
.speaking .eq i{animation:eq .7s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.24s}.eq i:nth-child(4){animation-delay:.36s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.timer{display:grid;gap:3px;min-width:180px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tline{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.tl{font-family:var(--sans);font-size:11px;color:var(--term-dim)}
.tv{font-size:15px;font-weight:600}
.prog{height:4px;border-radius:2px;background:var(--term-track);overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;width:0;background:var(--term-str);transition:width .25s linear}
.dots{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px}
.dot{width:26px;height:6px;border-radius:3px;border:0;background:var(--term-track);cursor:pointer;padding:0}
.dot.done{background:var(--term-dim)}
.dot.now{background:var(--term-key);transform:scaleY(1.5)}

.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;height:clamp(600px,74vh,780px)}
.col{background:var(--paper);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.head h2{font-size:13.5px;font-weight:700}
.head .sub{font-family:var(--mono);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.new{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}

/* ---- depicted POS screen ---- */
.pos{margin:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--scr-bg);color:var(--scr-ink);font-size:12px;position:relative}
.posbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--scr-bar);color:#fff;padding:8px 10px}
.posbar small{display:block;font-size:8.5px;letter-spacing:.1em;opacity:.55;font-weight:700}
.posbar b{font-size:12.5px}
.posbar .st{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700}
.posbar .st i{font-style:normal;background:var(--scr-accent);padding:4px 8px}
.postabs{display:flex;gap:5px;padding:7px 10px;background:var(--scr-paper);border-bottom:1px solid var(--scr-line)}
.postabs span{border:1px solid var(--scr-line);padding:4px 9px;font-weight:700;font-size:11px}
.postabs span.on{background:var(--scr-bar);color:#fff;border-color:var(--scr-bar)}
.posbody{padding:10px;display:grid;gap:10px;min-height:440px;align-content:start;position:relative}
.sh{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#3f434a;border-bottom:1px solid var(--scr-line);padding-bottom:5px}
.snote{font-size:11px;color:#3f434a}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.tile{position:relative;aspect-ratio:1;max-width:100%;background:var(--scr-paper);border:1px solid var(--scr-line);display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;padding:6px;transition:transform .2s,box-shadow .2s}
.tile svg{width:26px;height:26px;fill:#2b2f36}
.tile b{font-size:11.5px;line-height:1.15}
.tile em{font-style:normal;font-size:9px;color:var(--scr-muted)}
.tile .k{position:absolute;top:3px;right:5px;font-size:8.5px;color:var(--scr-muted)}
.tile.primary{border-color:var(--scr-accent)}
.tile.primary svg{fill:var(--scr-accent)}
.tile.hot{border-color:var(--scr-accent);box-shadow:0 0 0 3px rgba(69,51,255,.25);animation:press 1.2s ease-in-out infinite}
.tile.off{background:#F7F7F8;color:#A1A1AA;border-style:dashed}
.tile.off svg{fill:#C4C4CC}
@keyframes press{50%{transform:scale(.97)}}
.rlist{border:1px solid var(--scr-line);background:var(--scr-paper)}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #E4E4E8}
.rrow:last-child{border-bottom:0}
.rrow b{font-size:11.5px;display:block}
.rrow small{font-size:9.5px;color:var(--scr-muted);display:block}
.rrow .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow.ref b,.rrow.ref .amt{text-decoration:line-through;color:var(--scr-muted)}
.rrow.hot{background:var(--scr-accent-soft);outline:2px solid var(--scr-accent);outline-offset:-2px}
.badge{font-size:8.5px;font-weight:700;background:var(--scr-red-soft);color:var(--scr-red);padding:1px 5px;margin-right:6px;text-transform:uppercase}
.salegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.backrow{display:flex;gap:6px;align-items:center}
.sbtn{border:1px solid var(--scr-line);background:var(--scr-paper);padding:5px 9px;font-weight:700;font-size:11px;display:inline-block}
.sbtn.hot{border-color:var(--scr-accent);box-shadow:0 0 0 3px rgba(69,51,255,.25);animation:press 1.2s ease-in-out infinite}
.sbtn.pri{background:var(--scr-accent);color:#fff;border-color:var(--scr-accent)}
.sbtn.dan{background:var(--scr-red);color:#fff;border-color:var(--scr-red)}
.search{border:1px solid var(--scr-line);background:var(--scr-paper);padding:6px 8px;color:var(--scr-muted);font-size:11px}
.search.on{border-color:var(--scr-accent);color:var(--scr-ink);font-family:var(--mono)}
.prods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.prod{border:1px solid var(--scr-line);background:var(--scr-paper);padding:6px;display:grid;gap:3px;min-height:58px;align-content:space-between}
.prod b{font-size:10.5px;line-height:1.2}
.prod span{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700}
.prod span i{font-style:normal;font-weight:400;color:var(--scr-muted);font-size:9px}
.prod.hot{border-color:var(--scr-accent);background:var(--scr-accent-soft)}
.bill{border:1px solid var(--scr-line);background:var(--scr-paper);padding:7px;display:grid;gap:6px;align-content:start}
.bill h4{margin:0;font-size:11.5px;display:flex;justify-content:space-between;gap:6px}
.bill .ln{border:1px solid #E4E4E8;padding:5px;font-size:10.5px;display:flex;justify-content:space-between;gap:6px}
.bill .ln small{display:block;color:var(--scr-muted);font-size:9px}
.bill .tot{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--scr-line);padding-top:5px;font-size:12px}
.bill .pays{border:2px solid var(--scr-accent);padding:5px;display:grid;gap:4px;font-size:10px}
.bill .pays div{display:flex;gap:4px;flex-wrap:wrap}
.empty-bill{color:var(--scr-muted);font-size:10.5px;text-align:center;padding:14px 4px}
.sel{border:1px solid var(--scr-line);padding:5px;font-size:10.5px;background:var(--scr-paper)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:12px;z-index:2}
.modal{background:var(--scr-paper);width:min(320px,100%);max-height:100%;overflow:hidden;display:grid;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.modal header{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--scr-line);font-weight:700;font-size:12px}
.modal .mb{padding:9px 10px;display:grid;gap:7px}
.mlbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--scr-muted)}
.obtn{border:1px solid var(--scr-line);padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.obtn b{display:block;font-size:11px}.obtn small{display:block;font-size:9.5px;color:var(--scr-muted)}
.obtn.hot{border-color:var(--scr-accent);background:var(--scr-accent-soft)}
.sum{display:grid;gap:2px;font-size:10.5px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-weight:700;font-size:12px;border-top:1px solid var(--scr-line);padding-top:3px}
.warnbox{background:#FFF8E1;color:#5B4708;font-size:10px;padding:5px 6px}
.refbox{background:var(--scr-red-soft);border:1px solid #E2A5A5;color:var(--scr-red);padding:6px;font-size:11px}
.refbox b{display:block}
.ta{border:1px solid var(--scr-line);padding:5px;font-size:10.5px;min-height:34px}
.ta.on{border-color:var(--scr-accent)}
.scanbeam{display:flex;align-items:center;gap:8px;background:var(--scr-bar);color:#fff;padding:7px 9px;font-family:var(--mono);font-size:10.5px}
.scanbeam i{width:8px;height:8px;border-radius:50%;background:#E5484D;box-shadow:0 0 8px #E5484D;animation:blink .6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.picker{background:var(--scr-bar);color:#fff;min-height:440px;display:grid;place-content:center;gap:10px;padding:20px}
.picker small{font-size:9px;letter-spacing:.1em;opacity:.55;font-weight:700}
.picker h4{margin:0;font-size:17px}
.picker p{font-size:11px;opacity:.7}
.picker .stn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);padding:9px 11px;display:grid}
.picker .stn b{font-size:12.5px}.picker .stn span{font-size:10px;opacity:.6}
.picker .stn.hot{border-color:#8b80ff;background:rgba(255,255,255,.12)}
.ctable{width:100%;border-collapse:collapse;font-size:10.5px}
.ctable th,.ctable td{text-align:left;padding:4px 3px;border-bottom:1px solid #E4E4E8;font-variant-numeric:tabular-nums}
.ctable th{font-size:9px;color:var(--scr-muted);text-transform:uppercase;letter-spacing:.06em}
.ctable td.r,.ctable th.r{text-align:right}
.okpill{background:var(--scr-ok-soft);color:var(--scr-ok);font-weight:700;font-size:9px;padding:1px 5px}
.waitpill{background:#FFF4D6;color:#7A5A00;font-weight:700;font-size:9px;padding:1px 5px}
.ghostlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.ghostlist span{border:1px dashed var(--scr-line);color:#A1A1AA;padding:6px;font-size:10.5px;text-align:center}
.kbd{display:inline-flex;gap:4px;align-items:center;justify-self:start;background:var(--scr-bar);color:#fff;padding:5px 8px;font-family:var(--mono);font-size:11px;animation:rise .35s ease-out}
.kbd kbd{border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:0 5px;font-family:inherit}
.urlbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--scr-line);background:var(--scr-paper);font-family:var(--mono);font-size:10.5px;color:var(--scr-muted);min-width:0}
.urlbar i{width:8px;height:8px;border-radius:50%;background:#2F7D4F;flex:0 0 auto}
.urlbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- behind the scenes ---- */
.log{display:grid;gap:8px;padding:12px;align-content:start}
.ent{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk)}
.ent .eh{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;flex-wrap:wrap}
.ent .tn{font-family:var(--mono);font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.ent .ep{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.ent .why{padding:0 10px 8px;font-size:12px;color:var(--muted)}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.04em;flex:0 0 auto}
.tag.ui{background:var(--green-soft);color:var(--green)}
.tag.rpc{background:var(--sand-soft);color:var(--sand)}
.tag.local{background:var(--blue-soft);color:var(--blue)}
.tag.stripe{background:var(--violet-soft);color:var(--violet)}
.tag.key{background:var(--flag-soft);color:var(--flag)}
.json{background:var(--term);color:var(--term-ink);font-family:var(--mono);font-size:11.5px;line-height:1.55;padding:8px 10px;overflow-x:auto;white-space:pre}
.json .k{color:var(--term-key)}.json .s{color:var(--term-str)}.json .d{color:var(--term-dim)}
.empty{color:var(--muted);font-size:12.5px;padding:14px;text-align:center}

/* ---- register state ---- */
.ledger{display:grid;gap:10px;padding:12px;align-content:start}
.lc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--sunk)}
.lc.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--violet)}100%{box-shadow:0 0 0 0 transparent}}
.lc .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lc .src{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

function cal(p){
  const hd=["S","M","T","W","T","F","S"];let h='<div class="cal">'+hd.map(d=>'<div class="hd">'+d+'</div>').join("");
  // Oct 18 2026 is a Sunday; show Oct 18 → Nov 14
  const days=[];for(let i=0;i<28;i++){const d=new Date(2026,9,18+i);days.push(d)}
  days.forEach(d=>{const m=d.getMonth(),n=d.getDate();const off=Math.round((d-new Date(2026,9,20))/864e5);
    let c="";if(off===0)c="td";else if(off>0&&off<=14)c=p>.25?"in":"";
    if(off===14&&p>.25)c+=" edge";if(m===10&&n===7&&p>.5)c="ask";if(m===10&&n===8&&p>.75)c="ask";
    h+='<div class="'+c+'">'+(n===1||off===0?(m===9?"10/":"11/"):"")+n+'</div>'});
  return h+'</div>'}

const NARR={"ko": {"ov": "이 통화에서는 실패가 두 번 있었어요. 11월 7일 조회는 두 번 다 실패했고, 10월 24일은 빈 시간을 잘 찾았지만 12시 31분을 잡는 단계에서 또 두 번 실패했어요. 찾기와 잡기가 서로 다른 이유로 막혔어요. 그리고 둘 다 ElevenLabs가 아니라 우리 서버 문제였어요.", "nov7": "첫 번째 원인이에요. 전화 예약은 오늘부터 14일 뒤까지만 받아요. 오늘이 10월 20일이니 마지막 날은 11월 3일이에요. 11월 7일은 18일 뒤라 서버가 거절했어요. 이건 웹과 같은 규칙이라 정상이에요. 그런데 에이전트는 이 규칙을 몰라서 더 먼 8일과 9일을 권했어요.", "format": "서버는 거절할 때 이유를 문장으로 보냈어요. 그런데 그 문장을 422 오류 응답의 detail 칸에 넣었어요. 에이전트 프롬프트는 message 칸을 읽으라고 하고, 14일 규칙은 프롬프트 어디에도 없어요. 그래서 에이전트는 이유를 모른 채 시스템 문제라고 말하고 다시 시도했어요.", "hold": "두 번째 원인이에요. 10월 24일 찾기는 읽기만 해서 잘 됐어요. 12시 31분 잡기는 데이터베이스에 hold 줄을 써야 하는데, 그 저장을 Supabase가 PT422로 거절했어요. 서버는 이 오류를 문장으로 바꾸지 않아서 에이전트는 이유 없는 500 오류만 받았어요. Fly 로그에도 같은 오류가 남아 있어요.", "rewrite": "왜 거절됐을까요? 데이터베이스의 예약에는 확인 코드 같은 칸이 들어 있는데, 파이썬 모델은 그 칸을 몰라서 버려요. 그래서 아무것도 안 바꾼 예약도 모두 바뀐 것처럼 보여요. 결국 한 자리를 잡으려다 그날 예약 전체와 모든 hold를 다시 저장해요.", "guard": "다시 저장할 때 오늘 붙인 일출 일몰 트리거가 걸려요. upsert는 먼저 INSERT 트리거를 부르기 때문에, 시각을 그대로 둔 수정을 통과시키는 예외가 적용되지 않아요. 확인해 보니 10월 24일 아침 7시 34분에 직원이 넣은 예약 두 건이 있었어요. 그날 일출은 7시 40분이라, 오늘부터 닫힌 칸이에요. 이 두 줄이 PT422를 냈고, hold도 같이 저장되지 않았어요.", "other": "통화에서 같이 보인 것도 있어요. 회원 여부와 카트를 묻지 않았고, 세금 포함 요금을 말했고, 두 명이면 어떠냐는 말에 다시 찾지 않았어요. 저장소의 프롬프트와 다르게 움직여서, 실제 설정이 대시보드에서 바뀌었을 수 있어요. API 키에 권한이 없어 확인하지 못했어요.", "todo": "정리할게요. 근본 원인은 hold 하나 잡는데 하루 전체를 다시 쓰는 코드예요. 그 코드를 고치고, 전화 도구가 거절할 때 에이전트가 읽을 수 있는 message로 보내고, 프롬프트에 14일 규칙을 넣으면 돼요. 말씀 주시면 바로 고칠게요. ElevenLabs 키 권한과 확인 쿼리는 직접 해 주셔야 해요."}, "en": {"ov": "This call failed in two places. The November seventh search failed twice. October twenty-fourth found open times, but holding twelve thirty-one failed twice too. Search and hold broke for different reasons, and both were our server, not ElevenLabs.", "nov7": "Cause one. Phone bookings only go fourteen days out. Today is October twentieth, so the last day is November third. November seventh is eighteen days out, so the server said no. That's the same rule as the website, and it's working. But the agent didn't know the rule, so it offered the eighth and ninth, which are even further out.", "format": "The server did explain why, in a sentence. But it put that sentence in the detail field of a 422 error. The agent's prompt says to read the message field, and the fourteen-day rule isn't in the prompt at all. So the agent never got the reason, called it a system issue, and kept retrying.", "hold": "Cause two. Searching October twenty-fourth only reads, so it worked. Holding twelve thirty-one has to write a hold row, and Supabase rejected that write with PT422. The server doesn't turn that error into a sentence, so the agent got a bare 500. The same error is in the Fly log.", "rewrite": "Why was it rejected? Bookings in the database carry fields like the confirmation code, but the Python model doesn't know them and drops them. So every booking looks changed, even the untouched ones. Holding one seat ends up rewriting that whole day and every hold.", "guard": "That rewrite hits the daylight trigger added today. An upsert runs the INSERT trigger first, so the exception for edits at the same time never applies. The check query found two staff bookings at seven thirty-four in the morning on October twenty-fourth. Sunrise that day is seven forty, so that slot closed today. Those two rows raised PT422, and the hold went down with them.", "other": "A few other things showed up. The agent never asked about membership or a cart, quoted prices including tax, and didn't search again when the caller asked about two people. That doesn't match the prompt in the repo, so the live setup may have been changed in the dashboard. The API key lacks the permission to check.", "todo": "To sum up. The root cause is code that rewrites the whole day to hold one seat. Fix that, send phone rejections as a message the agent can read, and add the fourteen-day rule to the prompt. Say the word and I'll make the changes. The ElevenLabs key permission and the check query are for you to do."}};

/* ---------- state ---------- */
let LANG="ko", SC=0, SPEED=1, playing=false, finished=false, prog=0, runId=0;
let audio=null, t0=0, acc=0, tick=null;
try{const v=localStorage.getItem("phvb-lang");if(v==="en"||v==="ko")LANG=v}catch(e){}
try{const v=parseFloat(localStorage.getItem("phvb-speed"));if([1,1.25,1.5,2].includes(v))SPEED=v}catch(e){}

const clip=(l,i)=>"audio/"+l+"-"+S[i].a+".mp3";
const durOf=i=>DUR[S[i].a][LANG]*1000+700;
function fmt(ms){const x=Math.max(0,Math.round(ms/1000));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}

function fmtJson(o){
  return "{\n"+Object.entries(o).map(([k,v])=>{
    const val=v===null?'<span class="d">null</span>':typeof v==="string"?'<span class="s">"'+esc(v)+'"</span>':esc(v);
    return '  <span class="k">'+esc(k)+'</span>: '+val;
  }).join(",\n")+"\n}";
}
function ledgerAt(sc,p){
  const st={};const fl=new Set();
  for(const c of S[sc].ledger){if(c.at<=p){Object.assign(st,c);if(c.flash&&p-c.at<.08)c.flash.forEach(f=>fl.add(f))}}
  return {st,fl};
}
let lastLogN=-1,lastGuestKey="",lastLedgerKey="";
function renderLog(p,force){
  const items=S[SC].log.filter(e=>e.at<=p);
  if(!force&&items.length===lastLogN)return;
  const animate=!force&&items.length>lastLogN; lastLogN=items.length;
  if(!items.length){$("log").innerHTML='<p class="empty">'+UI[LANG].waitLog+'</p>';return}
  $("log").innerHTML=items.map((e,i)=>'<div class="ent'+(animate&&i===items.length-1?" new":"")+'"><div class="eh"><span class="tag '+e.tag+'">'+TAGS[e.tag]+'</span><span class="tn">'+esc(e.name)+'</span><span class="ep">'+esc(e.ep||"")+'</span></div>'+(e.why?'<p class="why">'+esc(e.why[LANG])+'</p>':"")+(e.body?'<div class="json">'+fmtJson(e.body)+'</div>':"")+'</div>').join("");
  const w=$("logWrap");w.scrollTop=w.scrollHeight;
}
function renderGuest(p,force){
  const html=S[SC].screen(LANG,p);
  if(!force&&html===lastGuestKey)return; lastGuestKey=html;
  $("gSub").textContent=S[SC][LANG];
  $("guest").innerHTML=html;
}
function renderStage(p,force){
  renderGuest(p,force);renderLog(p,force);
  const l=ledgerAt(SC,p);const key=JSON.stringify(l.st)+[...l.fl].join()+LANG;
  if(force||key!==lastLedgerKey){lastLedgerKey=key;renderLedger(p)}
}
function renderChips(){
  $("scen").innerHTML=S.map((s,i)=>'<button type="button" class="chip" aria-pressed="'+(i===SC)+'" data-s="'+i+'"><span class="no">'+String(i+1).padStart(2,"0")+'</span><span class="ph '+s.ph+'">'+PH[s.ph][LANG]+'</span>'+esc(s[LANG])+'</button>').join("");
  const b=$("scen").querySelector('[aria-pressed="true"]');if(b)b.scrollIntoView({block:"nearest",inline:"nearest"});
}
function renderCaption(){
  $("stepno").textContent=(SC+1)+" / "+S.length;
  $("capWho").textContent=UI[LANG].narr+" · "+(LANG==="ko"?"한국어":"English");
  $("capText").textContent=NARR[LANG][S[SC].a];
  $("dots").innerHTML=S.map((_,i)=>'<button type="button" class="dot'+(i<SC?" done":"")+(i===SC?" now":"")+'" data-i="'+i+'" aria-label="'+(i+1)+'"></button>').join("");
}
function renderUI(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=UI[LANG][el.dataset.i]});
  $("h1").innerHTML=UI[LANG].h1;
  $("lang").querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.v===LANG)));
  $("speed").querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked",String(+b.dataset.v===SPEED)));
  renderChips();renderCaption();updatePlay();renderStage(prog,true);updateTimes();
}
function updatePlay(){
  $("bPlay").innerHTML=playing?'<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>'+UI[LANG].pause:'<svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg>'+(finished||(SC===0&&prog>=1)?UI[LANG].play:UI[LANG].resume);
  $("cap").classList.toggle("speaking",playing&&$("tVoice").checked);
}
function updateTimes(){
  const sd=durOf(SC);const tot=S.reduce((a,_,i)=>a+durOf(i),0);const before=S.slice(0,SC).reduce((a,_,i)=>a+durOf(i),0);
  const el=before+sd*Math.min(1,prog);
  $("tmScene").textContent=fmt(sd*Math.min(1,prog)/SPEED)+" / "+fmt(sd/SPEED);
  $("tmAll").textContent=fmt(el/SPEED)+" / "+fmt(tot/SPEED);
  $("tmBar").style.width=(100*el/tot).toFixed(2)+"%";
}

/* ---------- player ---------- */
function stopAll(){runId++;if(audio){audio.onended=null;audio.pause();audio=null}clearInterval(tick);tick=null}
function elapsed(){return acc+(playing?(performance.now()-t0)*SPEED:0)}
function startTick(id){
  clearInterval(tick);
  tick=setInterval(()=>{
    if(id!==runId)return;
    const d=durOf(SC);
    let e=elapsed();
    if(audio&&isFinite(audio.duration)&&audio.duration>0&&!audio.paused)e=Math.max(e,audio.currentTime*1000);
    prog=Math.min(1,e/d);
    renderStage(prog,false);updateTimes();
    if(prog>=1&&(!audio||audio.ended||audio.paused))sceneDone(id);
  },120);
}
function sceneDone(id){
  if(id!==runId)return;
  stopAll();playing=false;prog=1;renderStage(1,false);
  const rid=runId;
  if($("tAll").checked&&SC<S.length-1){setTimeout(()=>{if(rid===runId&&!playing)playScene(SC+1,0)},900/SPEED)}
  else{finished=SC===S.length-1;}
  updatePlay();updateTimes();
}
function playScene(i,fromProg){
  stopAll();const id=runId;
  SC=i;finished=false;prog=fromProg||0;acc=prog*durOf(SC);t0=performance.now();playing=true;
  lastLogN=-1;lastGuestKey="";lastLedgerKey="";
  renderChips();renderCaption();renderStage(prog,true);updatePlay();updateTimes();
  if($("tVoice").checked){
    const a=new Audio(clip(LANG,SC));a.playbackRate=SPEED;a.preservesPitch=true;audio=a;
    a.addEventListener("loadedmetadata",()=>{if(id!==runId)return;const sec=a.duration;if(isFinite(sec)&&sec>0){DUR[S[SC].a][LANG]=sec;}if(fromProg)try{a.currentTime=Math.min(sec-0.1,fromProg*sec)}catch(e){}updateTimes()},{once:true});
    a.onended=()=>{if(id!==runId)return;acc=Math.max(elapsed(),durOf(SC)-700);t0=performance.now()};
    a.onerror=()=>{if(id===runId){audio=null}};
    a.play().catch(()=>{if(id===runId)audio=null});
  }
  startTick(id);
}
function pause(){acc=elapsed();if(audio)audio.pause();playing=false;clearInterval(tick);tick=null;updatePlay();updateTimes()}
function resume(){
  if(prog>=1||finished){playScene(finished?0:SC,0);return}
  if(audio&&audio.paused){playing=true;t0=performance.now();audio.play().catch(()=>{});startTick(runId);updatePlay();return}
  playScene(SC,prog);
}
function show(i){stopAll();playing=false;finished=false;SC=i;prog=1;lastLogN=-1;lastGuestKey="";lastLedgerKey="";renderChips();renderCaption();renderStage(1,true);updatePlay();updateTimes()}
function setLang(l){
  if(l===LANG)return;
  const was=playing;LANG=l;try{localStorage.setItem("phvb-lang",l)}catch(e){}
  if(was){playScene(SC,0)}else{stopAll()}
  renderUI();
}
function setSpeed(v){
  if(v===SPEED)return;
  if(playing){acc=elapsed();t0=performance.now()}
  SPEED=v;if(audio)audio.playbackRate=v;
  try{localStorage.setItem("phvb-speed",String(v))}catch(e){}
  $("speed").querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked",String(+b.dataset.v===v)));
  updateTimes();
}

$("bPlay").addEventListener("click",()=>{if(playing)pause();else if(SC===0&&prog>=1&&!finished)playScene(0,0);else resume()});
$("bRestart").addEventListener("click",()=>playScene(0,0));
$("bNext").addEventListener("click",()=>{const n=Math.min(SC+1,S.length-1);if(playing)playScene(n,0);else show(n)});
$("bPrev").addEventListener("click",()=>{const n=Math.max(SC-1,0);if(playing)playScene(n,0);else show(n)});
$("scen").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;const n=+b.dataset.s;if(playing)playScene(n,0);else show(n)});
$("dots").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;const n=+b.dataset.i;if(playing)playScene(n,0);else show(n)});
$("lang").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setLang(b.dataset.v)});
$("speed").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setSpeed(+b.dataset.v)});
$("tVoice").addEventListener("change",()=>{if(!$("tVoice").checked&&audio){audio.pause();audio=null}updatePlay()});
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();$("bPlay").click()}
  else if(e.key==="ArrowRight")$("bNext").click();
  else if(e.key==="ArrowLeft")$("bPrev").click();
  else if(e.key==="l"||e.key==="L")setLang(LANG==="ko"?"en":"ko");
});

prog=1;renderUI();
})();
</script></body></html>
</body></html>
