<title>Pelham Hills Marketing Strategy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one presenter column — header, scene chips, two-lane stage (picture · key points), dark narration band, player bar */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#1c2420; --muted:#5d6a62; --line:#d6ddd6;
  --green:#1a7f4b; --green-soft:#dcefe3; --gold:#b7791f; --gold-soft:#f8ecd6; --red:#b4412f;
  --band:#14201a; --band-ink:#e9f2ec; --band-muted:#9fb5a8;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:7px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--sans);padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.chip[aria-current="true"] b{color:var(--green)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;min-height:400px}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0;display:grid;align-content:start;gap:12px}
.lane h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
.lane .lt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.pts li i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--green);padding-top:2px}
.band{background:var(--band);color:var(--band-ink);padding:14px 16px;min-height:96px;display:grid;gap:4px}
.band .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
.band p{margin:0;font-size:16px;line-height:1.6}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--sans);min-height:44px;min-width:44px;padding:0 14px;cursor:pointer}
.pbtn.main{background:var(--green);border-color:var(--green);color:#fff;min-width:120px}
.bar{flex:1 1 160px;height:6px;background:var(--line);position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--green);width:0}
.speed{font:500 13px var(--sans);color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;background:var(--gold-soft);color:var(--gold)}
.tag.ok{background:var(--green-soft);color:var(--green)}
/* scene visuals */
.mock{border:1px solid var(--line);display:grid}
.mock .mh{padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.mock .mb{padding:10px;display:grid;gap:8px}
.mta{border:1px solid var(--line);padding:8px;color:var(--muted);font-size:13px;min-height:52px}
.mbtn{justify-self:start;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 12px}
.msec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.msec div{border:1px dashed var(--line);padding:8px;font-size:12px;color:var(--muted)}
.msec div b{display:block;color:var(--ink);font-size:13px}
.tw{overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;min-width:460px;font-size:13px;font-variant-numeric:tabular-nums}
table.hm th{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
table.hm th.r{text-align:left;color:var(--ink);font-size:13px;white-space:nowrap}
table.hm td{text-align:center;padding:6px 2px;font-weight:600}
table.hm td.empty{outline:2px dashed var(--gold);outline-offset:-2px}
.chart{display:grid;gap:8px}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13px}
.row .t{height:16px;background:var(--line)}
.row .t span{display:block;height:100%;background:var(--green)}
.row.hl .t span{background:var(--gold)}
.row .v{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.stack{display:flex;height:34px}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.offer{border:1px solid var(--green);background:var(--green-soft);padding:10px;display:grid;gap:4px;font-size:13px}
.offer b{font-size:14px}
.code{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:1px 6px}
.ladder{position:relative;height:210px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 4px 22px 4px}
.ladder .zone{position:absolute;top:0;bottom:0;background:var(--gold-soft)}
.ladder .zone em{position:absolute;top:4px;left:6px;font-style:normal;font-size:11px;font-weight:700;color:var(--gold)}
.ladder .pin{position:absolute;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;font-size:11px;white-space:nowrap}
.ladder .pin s{display:block;width:10px;height:10px;border-radius:50%;background:var(--green);text-decoration:none}
.ladder .pin.h s{background:var(--gold)}
.ladder .tick{position:absolute;bottom:-20px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-family:var(--mono)}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.plan{grid-template-columns:minmax(0,1fr)}}
.plan div{border:1px solid var(--line);padding:10px;display:grid;gap:6px;align-content:start;font-size:13px}
.plan h3{margin:0;font-size:14px}
.plan ul{margin:0;padding-left:18px;display:grid;gap:4px}
.check{display:grid;gap:8px}
.check div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);padding:10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.lane{animation:in .35s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-ko" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H9l-5 4v-4H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="13.5" font-size="8" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-weight="700">가</text></svg>한국어</button>
      <button id="lang-en" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H9l-5 4v-4H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="13.5" font-size="8" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-weight="700">Aa</text></svg>English</button>
    </div>
  </header>
  <nav class="chips" id="chips" aria-label="Scenes"></nav>
  <section class="stage" id="stage"></section>
  <section class="band" aria-live="polite"><div class="who" id="who"></div><p id="narr"></p></section>
  <div class="player">
    <button class="pbtn" id="prev" type="button" aria-label="Previous">◀</button>
    <button class="pbtn main" id="play" type="button"></button>
    <button class="pbtn" id="next" type="button" aria-label="Next">▶</button>
    <div class="bar" aria-hidden="true"><span id="prog"></span></div>
    <label class="speed"><span id="speedL"></span>
      <select id="speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.4">1.4×</option></select>
    </label>
  </div>
  <p class="note" id="foot"></p>
</div>
<audio id="audio" preload="auto"></audio>

<script>
const NARR = __NARR__;
const DUR = __DUR__;
let LANG = "ko";
try { const s = localStorage.getItem("pelham-deck-lang"); if (s === "en" || s === "ko") LANG = s; } catch (e) {}
const T = (o) => (typeof o === "string" ? o : o[LANG]);

const UI = {
  eyebrow: { ko: "AI Manager Marketing Strategies", en: "AI Manager Marketing Strategies" },
  title: { ko: "펠햄힐스 마케팅 전략 제안", en: "Pelham Hills marketing strategy" },
  sub: { ko: "화면 숫자 2026-09-26 → 10-25 기준 · 예시 제안 · 나레이션 Hope", en: "Built from the screen numbers, 2026-09-26 → 10-25 · example strategy · narrated by Hope" },
  play: { ko: "▶ 재생", en: "▶ Play" }, pause: { ko: "❚❚ 멈춤", en: "❚❚ Pause" },
  speed: { ko: "속도 ", en: "Speed " }, who: { ko: "나레이션", en: "Narration" },
  pic: { ko: "화면", en: "Picture" }, keys: { ko: "핵심", en: "Key points" },
  foot: { ko: "라운드 숫자는 AI 마케팅 화면(최근 30일)의 하루 평균입니다. 인구는 2021 인구조사 기준 대략, 운전 시간은 196 Webber Rd에서 대략입니다. 전략은 이 숫자로 만든 예시이며, 화면의 버튼을 누르면 Claude가 고른 기간의 숫자로 새로 씁니다.",
          en: "Round figures are per-day averages from the AI Marketing page (last 30 days). Populations are approximate (2021 Census); drive times from 196 Webber Rd are approximate. The strategy is an example built from these numbers; the button on the page has Claude write a fresh one for the period you pick." },
};

const HM = [
  ["Members", "회원", [7.8, 0.9, 0.8, 0.7, 0.4, 0.5]],
  ["Public", "일반", [3.3, 2.1, 1.4, 10.7, 8.2, 3.8]],
  ["GolfNow", "골프나우", [3.9, 1.1, 0, 8.2, 2.1, 0.5]],
];
const COLS = { ko: ["평일 오전", "평일 12–3", "평일 3시+", "주말 오전", "주말 12–3", "주말 3시+"], en: ["Weekday AM", "Weekday 12–3", "Weekday 3 PM+", "Weekend AM", "Weekend 12–3", "Weekend 3 PM+"] };

function heatmap() {
  const max = 10.7;
  let h = `<div class="tw"><table class="hm"><thead><tr><th></th>${COLS[LANG].map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>`;
  for (const [en, ko, vals] of HM) {
    h += `<tr><th class="r">${LANG === "ko" ? ko : en}</th>` + vals.map((v, i) => {
      const s = v / max, empty = (i === 1 || i === 2) && v < 2.2;
      return `<td class="${empty ? "empty" : ""}" style="background:color-mix(in srgb, var(--green) ${Math.round(8 + s * 80)}%, var(--panel));color:${s > .55 ? "#fff" : "var(--ink)"}">${v ? v.toFixed(1) : "·"}</td>`;
    }).join("") + "</tr>";
  }
  return h + `</tbody></table></div><div class="legend"><span><i style="outline:2px dashed var(--gold)"></i>${T({ ko: "비어 있는 평일 오후", en: "Empty weekday afternoons" })}</span><span>${T({ ko: "하루 평균 라운드", en: "Rounds per day" })}</span></div>`;
}

function bars(rows, max, unit) {
  return `<div class="chart">${rows.map((r) => `<div class="row ${r.hl ? "hl" : ""}"><span>${T(r.l)}</span><div class="t"><span style="width:${(r.v / max) * 100}%"></span></div><span class="v">${r.f || r.v.toFixed(1)}${unit || ""}</span></div>`).join("")}</div>`;
}

const S = [
  { n: { ko: "새 버튼", en: "New button" },
    h: { ko: "Claude가 이 기간의 숫자로 전략을 씁니다", en: "Claude writes a strategy from this period's numbers" },
    pic: () => `<div class="mock"><div class="mh">${T({ ko: "Claude의 마케팅 전략", en: "Claude's marketing strategy" })}</div><div class="mb">
      <div class="mta">${T({ ko: "특별히 원하는 방향(선택) — 예: 평일 오후 채우기, 해밀턴 골퍼 유치", en: "Anything to focus on? (optional) — e.g. fill weekday afternoons, bring Hamilton golfers" })}</div>
      <div class="mbtn">${T({ ko: "Claude에게 전략 요청", en: "Ask Claude for a strategy" })}</div>
      <div class="msec"><div><b>${T({ ko: "숫자가 말해 주는 것", en: "What the numbers say" })}</b>${T({ ko: "사실 4–7개 + 근거 숫자", en: "4–7 facts + the number behind each" })}</div>
      <div><b>${T({ ko: "전략", en: "Strategies" })}</b>${T({ ko: "대상·시간대·지역·혜택·채널·단계·측정", en: "group · slot · area · offer · channels · steps · KPI" })}</div>
      <div><b>${T({ ko: "지역 니치", en: "Local niches" })}</b>${T({ ko: "나이아가라 → 해밀턴 경계", en: "Niagara → Hamilton boundary" })}</div>
      <div><b>${T({ ko: "전개 일정", en: "Rollout" })}</b>${T({ ko: "30 · 60 · 90일", en: "30 · 60 · 90 days" })}</div></div></div></div>`,
    pts: [{ ko: "보내는 것: 기간 합계 숫자 + 주변 상권(인구·운전 시간)", en: "Sends: period totals + trade area (population, drive time)" },
      { ko: "보내지 않는 것: 이름·이메일·전화번호", en: "Never sends names, emails or phone numbers" },
      { ko: "화면이 한이면 한국어, EN이면 영어로 작성", en: "Writes in Korean or English, matching the EN / 한 toggle" },
      { ko: "누를 때만 호출(1–2분, 유료) · 결과는 기간별로 브라우저에 보관", en: "Runs only on a click (1–2 min, paid) · last result kept per period" }] },
  { n: { ko: "숫자", en: "Numbers" },
    h: { ko: "주말 오전은 꽉, 평일 오후는 텅", en: "Weekend mornings full, weekday afternoons empty" },
    pic: heatmap,
    pts: [{ ko: "30일 1,016 라운드 · 예약 408건", en: "1,016 rounds · 408 bookings in 30 days" },
      { ko: "주말 오전: 일반 10.7 + 골프나우 8.2 / 일", en: "Weekend AM: public 10.7 + GolfNow 8.2 a day" },
      { ko: "평일 12시 이후: 세 그룹 합계 하루 약 6 라운드", en: "Weekday after noon: about 6 rounds a day across all three groups" },
      { ko: "골퍼 1인 매출 $54.20 (결제 골퍼 373명)", en: "Sales per golfer $54.20 (373 paid golfers)" },
      { ko: "고객 기록 연결 0% → 재방문율 측정 불가", en: "0% of rounds linked to a customer → no repeat rate yet" }] },
  { n: { ko: "전략 1", en: "Strategy 1" },
    h: { ko: "평일 오후 채우기 — 이웃과 학생", en: "Fill weekday afternoons — neighbours and students" },
    pic: () => bars([
        { l: COLS[LANG][0], v: 15.0 }, { l: COLS[LANG][1], v: 4.1, hl: 1 }, { l: COLS[LANG][2], v: 2.2, hl: 1 },
        { l: COLS[LANG][3], v: 19.6 }, { l: COLS[LANG][4], v: 10.7 }, { l: COLS[LANG][5], v: 4.8 }], 19.6) +
      `<p class="note">${T({ ko: "회원·일반·골프나우 하루 평균 합계", en: "Members + public + GolfNow, rounds per day" })}</p>
      <div class="offer"><b>${T({ ko: "평일 12시 이후 전용 요금", en: "Weekday after-noon rate" })}</b>${T({ ko: "대상: 웰랜드·펠햄 이웃, 나이아가라 칼리지 학생", en: "For Welland and Pelham neighbours and Niagara College students" })}<span>${T({ ko: "추적 코드", en: "Tracking code" })} <span class="code">PROMO-WKPM</span></span></div>`,
    pts: [{ ko: "문자 동의한 사람에게만 · 수신거부 제외", en: "Text only people who agreed · skip opt-outs" },
      { ko: "명단의 10%는 비교군으로 보내지 않기", en: "Hold back 10% of the list as a comparison group" },
      { ko: "측정: 평일 12–3·3시+ 라운드, 코드 사용 수", en: "Measure: weekday 12–3 and 3 PM+ rounds, code uses" },
      { ko: "예산: 적음 (기존 문자·웹사이트 팝업)", en: "Budget: low (existing texts and website pop-ups)" }] },
  { n: { ko: "전략 2", en: "Strategy 2" },
    h: { ko: "주말 오전은 골프나우 대신 직접 예약으로", en: "Move weekend mornings from GolfNow to direct" },
    pic: () => {
      const parts = [["public", 10.7, "var(--green)", { ko: "일반", en: "Public" }], ["gn", 8.2, "var(--gold)", { ko: "골프나우", en: "GolfNow" }], ["m", 0.9, "var(--muted)", { ko: "회원·기타", en: "Members + other" }]];
      const tot = parts.reduce((t, p) => t + p[1], 0);
      return `<div class="lt">${T({ ko: "주말 오전 하루 평균", en: "Weekend AM, rounds per day" })}</div><div class="stack">${parts.map((p) => `<span style="width:${(p[1] / tot) * 100}%;background:${p[2]}">${Math.round((p[1] / tot) * 100)}%</span>`).join("")}</div>
        <div class="legend">${parts.map((p) => `<span><i style="background:${p[2]}"></i>${T(p[3])} ${p[1]}</span>`).join("")}</div>
        <div class="offer"><b>${T({ ko: "직접 예약 혜택", en: "Book-direct perk" })}</b>${T({ ko: "체크인 때 /book/login 가입 권유 → 다음 예약은 웹사이트에서, 카트 또는 스낵바 혜택", en: "Invite sign-up on /book/login at check-in → next booking on the website, with a cart or snack bar perk" })}</div>`;
    },
    pts: [{ ko: "주말 오전 손님의 약 40%가 골프나우", en: "About 40% of weekend morning golfers come via GolfNow" },

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, playing = false, timer = null, startAt = 0;

function renderUI() {
  $("eyebrow").textContent = T(UI.eyebrow); $("title").textContent = T(UI.title); $("sub").textContent = T(UI.sub);
  $("who").textContent = T(UI.who); $("speedL").textContent = T(UI.speed); $("foot").textContent = T(UI.foot);
  $("play").textContent = playing ? T(UI.pause) : T(UI.play);
  $("lang-ko").setAttribute("aria-pressed", LANG === "ko"); $("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.documentElement.lang = LANG;
  $("chips").innerHTML = S.map((s, i) => `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}"><b>${i + 1}</b>${T(s.n)}</button>`).join("");
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $("stage").innerHTML = `<div class="lane"><div class="lt">${T(UI.pic)}</div><h2>${T(s.h)}</h2>${s.pic()}</div>
    <div class="lane"><div class="lt">${T(UI.keys)}</div><ul class="pts">${s.pts.map((p, k) => `<li><i>${k + 1}</i><span>${T(p)}</span></li>`).join("")}</ul></div>`;
  $("narr").textContent = NARR[LANG][cur];
  $("prog").style.width = "0";
  renderUI();
}

function stopAudio() { audio.pause(); clearInterval(timer); }
function playScene() {
  stopAudio();
  audio.src = `audio/${LANG}/s${cur + 1}.mp3`;
  audio.playbackRate = Number($("speed").value);
  const p = audio.play();
  if (p && p.catch) p.catch(() => { playing = false; renderUI(); });
  timer = setInterval(() => {
    const d = audio.duration || DUR[LANG][cur] || 1;
    $("prog").style.width = `${Math.min(100, (audio.currentTime / d) * 100)}%`;
  }, 200);
}
audio.addEventListener("ended", () => {
  clearInterval(timer); $("prog").style.width = "100%";
  if (playing && cur < S.length - 1) setTimeout(() => { if (playing) { show(cur + 1); playScene(); } }, 700);
  else { playing = false; renderUI(); }
});
$("play").onclick = () => { playing = !playing; if (playing) playScene(); else stopAudio(); renderUI(); };
$("prev").onclick = () => { show(cur - 1); if (playing) playScene(); };
$("next").onclick = () => { show(cur + 1); if (playing) playScene(); };
$("chips").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; show(Number(b.dataset.i)); if (playing) playScene(); };
$("speed").onchange = () => { audio.playbackRate = Number($("speed").value); };
function setLang(l) { LANG = l; try { localStorage.setItem("pelham-deck-lang", l); } catch (e) {} show(cur); if (playing) playScene(); }
$("lang-ko").onclick = () => setLang("ko");
$("lang-en").onclick = () => setLang("en");
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); });
show(0);
</script>
