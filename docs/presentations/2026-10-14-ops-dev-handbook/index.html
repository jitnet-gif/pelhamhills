<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pelham Hills 운영·개발 총서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: presenter bar (scenes + controls + language) over a dark narration band, then a three-lane stage — picture of the scene · key points behind it · checklist with real status. Part 1 (operations) is green, Part 2 (development) is blue. */
:root{
  --bg:#EEF2EC; --paper:#FFFFFF; --ink:#15211B; --muted:#5B6B62; --line:#D6DED5; --sunk:#F5F7F3;
  --green:#1E5A3F; --green-soft:#E1EDE5; --flag:#D4572A; --flag-soft:#FBE5DB;
  --violet:#4533FF; --violet-soft:#ECEAFF; --blue:#2D5E8C; --blue-soft:#E2ECF5;
  --sand:#9C7424; --sand-soft:#F5EDDC; --ok:#2F7D4F; --ok-soft:#E0F1E6; --red:#B42318; --red-soft:#FDECEA;
  --term:#14201A; --term-ink:#DDE8E0; --term-key:#8FD3AE; --term-str:#F2C48B; --term-dim:#7F9489; --term-track:#2E3F35;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1511; --paper:#162019; --ink:#E6ECE7; --muted:#9AAA9F; --line:#2A3830; --sunk:#111A15;
    --green:#6BC196; --green-soft:#1B3127; --flag:#F08A5D; --flag-soft:#3A2219;
    --violet:#A99FFF; --violet-soft:#241F44; --blue:#7AAEDB; --blue-soft:#182A3A;
    --sand:#D9B566; --sand-soft:#2E2715; --ok:#6BCB8E; --ok-soft:#173222; --red:#F97066; --red-soft:#3A1A17;
    --term:#0A110D; --term-ink:#D6E2DA; --term-key:#8FD3AE; --term-str:#F2C48B; --term-dim:#6E8277; --term-track:#22302A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1511; --paper:#162019; --ink:#E6ECE7; --muted:#9AAA9F; --line:#2A3830; --sunk:#111A15;
  --green:#6BC196; --green-soft:#1B3127; --flag:#F08A5D; --flag-soft:#3A2219;
  --violet:#A99FFF; --violet-soft:#241F44; --blue:#7AAEDB; --blue-soft:#182A3A;
  --sand:#D9B566; --sand-soft:#2E2715; --ok:#6BCB8E; --ok-soft:#173222; --red:#F97066; --red-soft:#3A1A17;
  --term:#0A110D; --term-ink:#D6E2DA; --term-key:#8FD3AE; --term-str:#F2C48B; --term-dim:#6E8277; --term-track:#22302A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:20px 40px}
.app{max-width:1440px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.top .tx{display:grid;gap:4px;min-width:0;flex:1 1 520px}
.top h1{font-size:clamp(22px,3vw,30px);font-weight:700}
.top h1 b{color:var(--green)}
.top .lede{color:var(--muted);max-width:76ch;font-size:13.5px}
/* big language switch with icons */
.langbig{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px}
.langbig .gl{width:22px;height:22px;color:var(--muted);margin-left:4px}
.lbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:9px;padding:6px 12px 6px 6px;cursor:pointer;font-weight:700;font-size:13.5px}
.lbtn .ico{width:30px;height:30px;flex:0 0 auto}
.lbtn small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);line-height:1.1}
.lbtn span{display:grid;text-align:left;line-height:1.15}
.lbtn[aria-checked="true"]{background:var(--violet);color:#fff}
.lbtn[aria-checked="true"] small{color:#fff;opacity:.8}
.lbtn:not([aria-checked="true"]):hover{border-color:var(--line)}

.parts{display:flex;flex-wrap:wrap;gap:8px;font-size:12px}
.part{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.part i{width:10px;height:10px;border-radius:3px}

.scen{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip .ph{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:4px}
.ph.intro{background:var(--sand-soft);color:var(--sand)}
.ph.ops{background:var(--green-soft);color:var(--green)}
.ph.dev{background:var(--blue-soft);color:var(--blue)}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--paper)}
.chip[aria-pressed="true"] .no{color:var(--paper);opacity:.8}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;height:36px;min-width:36px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.play{background:var(--flag);border-color:var(--flag);color:#fff;min-width:150px;font-size:14px}
.btn svg{width:14px;height:14px;fill:currentColor}
.sep{width:1px;height:26px;background:var(--line)}
.lbl{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;height:34px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer;border-right:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg.lang button[aria-checked="true"]{background:var(--violet);color:#fff}
.seg.lang .ico{width:20px;height:20px}
.seg.speed button{font-family:var(--mono)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
.tog input{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.tog input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:left .15s}
.tog input:checked{background:var(--green)}
.tog input:checked::after{left:16px}
.spacer{flex:1}
.voice{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--violet-soft);color:var(--violet);font-family:var(--mono);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.voice svg{width:13px;height:13px;fill:currentColor}

.cap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--term);color:var(--term-ink);border-radius:12px;padding:14px 18px}
.stepno{font-family:var(--mono);font-size:12px;color:var(--term-key);border:1px solid var(--term-dim);border-radius:6px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap p{font-size:clamp(15px,1.6vw,18px);font-weight:500;line-height:1.6;min-height:3.2em}
.cap .who{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--term-dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.cap .who .ico{width:16px;height:16px}
.eq{display:inline-flex;gap:2px;align-items:center;height:12px}
.eq i{width:3px;height:4px;border-radius:2px;background:var(--term-key)}
.speaking .eq i{animation:eq .7s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.24s}.eq i:nth-child(4){animation-delay:.36s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.timer{display:grid;gap:3px;min-width:180px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tline{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.tl{font-family:var(--sans);font-size:11px;color:var(--term-dim)}
.tv{font-size:15px;font-weight:600}
.prog{height:4px;border-radius:2px;background:var(--term-track);overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;width:0;background:var(--term-str);transition:width .25s linear}
.dots{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px}
.dot{width:26px;height:6px;border-radius:3px;border:0;background:var(--term-track);cursor:pointer;padding:0}
.dot.done{background:var(--term-dim)}
.dot.now{background:var(--term-key);transform:scaleY(1.5)}

.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.85fr);gap:12px;height:clamp(600px,74vh,780px)}
.col{background:var(--paper);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.head h2{font-size:13.5px;font-weight:700}
.head .sub{font-family:var(--mono);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.new{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}

/* ---- picture lane ---- */
.pic{padding:14px;display:grid;gap:12px;align-content:start}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ptitle h3{font-size:17px}
.ptitle span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.rlabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.node{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:8px 10px;display:grid;gap:2px;min-width:0;transition:opacity .3s,box-shadow .3s,border-color .3s}
.node b{font-size:12.5px;overflow-wrap:anywhere}
.node small{font-size:11px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.node code,.mono{font-family:var(--mono);font-size:10.5px}
.node.g{background:var(--green-soft);border-color:transparent}.node.g b{color:var(--green)}
.node.b{background:var(--blue-soft);border-color:transparent}.node.b b{color:var(--blue)}
.node.v{background:var(--violet-soft);border-color:transparent}.node.v b{color:var(--violet)}
.node.s{background:var(--sand-soft);border-color:transparent}.node.s b{color:var(--sand)}
.node.f{background:var(--flag-soft);border-color:transparent}.node.f b{color:var(--flag)}
.node.off{opacity:.28}
.node.hot{box-shadow:0 0 0 2px var(--ink)}
.arrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-family:var(--mono);padding-left:10px}
.arrow::before{content:"";width:2px;height:16px;background:var(--line);border-radius:1px}
.steps{display:grid;gap:6px;counter-reset:st}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--sunk);transition:opacity .3s,box-shadow .3s}
.step .n{font-family:var(--mono);font-size:12px;font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.step b{font-size:12.5px;display:block}
.step small{font-size:11px;color:var(--muted);display:block}
.step em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.step.off{opacity:.28}.step.hot{box-shadow:0 0 0 2px var(--green)}
.dev .step .n{background:var(--blue-soft);color:var(--blue)}.dev .step.hot{box-shadow:0 0 0 2px var(--blue)}
/* mock screens */
.mock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;background:var(--term);color:var(--term-ink);font-size:11.5px;font-weight:700}
.mbar span{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--term-dim)}
.mbody{padding:9px;display:grid;gap:7px}
.tgrid{width:100%;border-collapse:collapse;font-size:11.5px}
.tgrid td,.tgrid th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:middle}
.tgrid th{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tgrid td.t{font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.pc{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--green-soft);color:var(--green);margin:1px 2px 1px 0;white-space:nowrap}
.pc.arr{background:var(--ok);color:#fff}
.pc.web{background:var(--violet-soft);color:var(--violet)}
.pc.ph{background:var(--sand-soft);color:var(--sand)}
.pc.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.rate{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.rate.hol{border-color:var(--flag);color:var(--flag)}
.redcnt{color:var(--red);font-weight:700}
.card2{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:grid;gap:4px;background:var(--sunk);transition:box-shadow .3s}
.card2.hot{box-shadow:0 0 0 2px var(--violet)}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-variant-numeric:tabular-nums}
.ln span:first-child{min-width:0;overflow-wrap:anywhere}
.ln.tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}
.ln.sub{color:var(--muted);font-size:11px}
.ln.gone{text-decoration:line-through;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:5px}
.mb{font-size:10.5px;font-weight:700;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.mb.pri{background:var(--violet);border-color:var(--violet);color:#fff}
.mb.hot{box-shadow:0 0 0 2px var(--violet);animation:press 1.2s ease-in-out infinite}
@keyframes press{50%{transform:scale(.96)}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:200px}
.pinpad span{border:1px solid var(--line);border-radius:6px;text-align:center;padding:5px 0;font-family:var(--mono);font-size:12px;background:var(--paper)}
.pindots{display:flex;gap:6px;font-size:18px;letter-spacing:2px;color:var(--violet)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.tile{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 6px;display:grid;justify-items:center;gap:4px;text-align:center;font-size:11.5px;font-weight:700;transition:box-shadow .3s}
.tile i{font-style:normal;font-size:10px;font-family:var(--mono);color:var(--muted);font-weight:400}
.tile.hot{box-shadow:0 0 0 2px var(--violet)}
.beam{display:flex;align-items:center;gap:8px;background:var(--term);color:var(--term-ink);padding:6px 9px;border-radius:7px;font-family:var(--mono);font-size:10.5px}
.beam i{width:8px;height:8px;border-radius:50%;background:#E5484D;box-shadow:0 0 8px #E5484D;animation:blink .6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.bars{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.brow .tr{height:12px;border-radius:3px;background:var(--sunk);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:3px;transition:width .6s ease-out}
.brow b{text-align:right}
.json{background:var(--term);color:var(--term-ink);font-family:var(--mono);font-size:11.5px;line-height:1.55;padding:8px 10px;overflow-x:auto;white-space:pre;border-radius:8px}
.json .k{color:var(--term-key)}.json .s{color:var(--term-str)}.json .d{color:var(--term-dim)}
.migs{display:grid;gap:4px}
.mig{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11.5px;padding:4px 8px;border-radius:6px;background:var(--sunk);transition:opacity .3s}
.mig .mono{color:var(--blue);font-weight:600}
.mig small{color:var(--muted);font-size:10.5px;white-space:nowrap}
.mig.off{opacity:.25}

/* ---- key points lane ---- */
.log{display:grid;gap:8px;padding:12px;align-content:start}
.ent{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk)}
.ent .eh{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;flex-wrap:wrap}
.ent .tn{font-family:var(--mono);font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.ent .ep{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.ent .why{padding:0 10px 8px;font-size:12px;color:var(--muted)}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.04em;flex:0 0 auto}
.tag.ui{background:var(--green-soft);color:var(--green)}
.tag.rpc{background:var(--sand-soft);color:var(--sand)}
.tag.api{background:var(--blue-soft);color:var(--blue)}
.tag.ext{background:var(--violet-soft);color:var(--violet)}
.tag.ops{background:var(--flag-soft);color:var(--flag)}
.tag.rule{background:var(--ink);color:var(--bg)}
.empty{color:var(--muted);font-size:12.5px;padding:14px;text-align:center}

/* ---- checklist lane ---- */
.ledger{display:grid;gap:8px;padding:12px;align-content:start}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--sunk);font-size:12.5px}
.ck.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--violet)}100%{box-shadow:0 0 0 0 transparent}}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.user{background:var(--sand-soft);color:var(--sand)}
.pill.todo{background:var(--flag-soft);color:var(--flag)}
.pill.tip{background:var(--blue-soft);color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}

footer{font-size:12px;color:var(--muted);display:grid;gap:4px;max-width:120ch}

@media (max-width:1180px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:auto}
  .col{height:620px}
  .col.ledgercol{grid-column:1 / -1;height:auto;max-height:640px}
}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .col{height:auto;max-height:680px}
  .col.ledgercol{max-height:none}
  .cap{grid-template-columns:minmax(0,1fr)}
  .timer{min-width:0}
  .sep{display:none}
  .brow{grid-template-columns:90px minmax(0,1fr) 60px}
  .lbtn{padding-right:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}
}
</style>

const NARR={"ko": {"ov": "안녕하세요! 펠햄 힐스 골프 클럽 시스템의 총 운영 매뉴얼과 개발 총서를 한 번에 정리해 드릴게요. 이 장면 다음의 아홉 장면은 직원이 매일 쓰는 운영 매뉴얼이고, 마지막 다섯 장면은 시스템을 고치고 배포하는 개발 총서예요. 손님용 예약 사이트, 직원용 어드민, 그리고 그 뒤의 데이터베이스와 결제·음성 서버까지, 전체 지도부터 보고 시작할게요.", "day": "하루는 이렇게 흘러가요. 아침에 어드민을 열면 티 시트가 첫 화면이에요. 손님이 오면 Arrived로 체크인하고, 그린피와 카트, 프로샵 상품을 한 계산서에 담아 결제해요. 실내 골프는 Bay Sheet에서, 스낵바는 스낵바 계산대에서 받아요. 영업이 끝나면 계산대마다 Close Register로 돈을 세고, 직원별 마감으로 팁을 나눈 뒤, Reports에서 하루 매출을 확인해요.", "book": "손님이 예약하는 길은 네 가지예요. 웹사이트의 Book 페이지에서 티타임과 실내 골프를 고르고 Stripe로 미리 결제할 수 있어요. 전화를 걸면 AI 상담원 Hope가 받아서 발신번호로 예약하고, 문자로 book이라고 보내면 예약 양식이 와요. 예약마다 숫자 확인번호와 체크인 바코드가 문자로 가요. 손님은 My Booking에서 직접 바꾸거나 취소하고, 빈자리는 대기자에게 먼저 돌아가요.", "tee": "티 시트는 운영의 중심이에요. 티타임마다 최대 네 명이고, 예약을 끌어서 시간을 옮기거나 다음 빈 시간으로 복제할 수 있어요. 요금은 평일, 주말, 공휴일로 나뉘어 자동으로 붙고, 선수 카드의 플러스 버튼으로 하프 카트, 풀카트, 레인지 바스켓을 그 사람 몫에 더해요. 화면은 5초마다 새로 읽고, 인터넷이 끊기면 수정을 막아서 두 기기가 서로 덮어쓰지 않아요. 코스에 나간 카트는 빨간 숫자로 보여요.", "pay": "결제는 한 계산서 원칙이에요. 그린피, 카트, 프로샵, 스낵바, 시뮬레이터 베이가 모두 같은 계산서에 담기고, 금액은 브라우저가 아니라 데이터베이스가 정해요. 카드는 Stripe 하나로 통일했어요. 온라인은 Stripe Checkout, 계산대는 S700 단말기로 보내요. 현금, 데빗, 레인체크도 받고, 결제 줄을 지우면 환불이 돼요. 계산서는 절대 지우지 않고 환불 상태로 남아요.", "pin": "돈이 움직이는 위험한 동작에는 매니저 PIN을 물어요. 환불, 레인체크 발행, 선수 삭제, 결제 지우기, 그리고 그린피나 카트 요금을 바꿀 때예요. PIN이 맞으면 누가 언제 승인했는지 예약 기록에 남아요. 그래서 나중에 리포트를 볼 때 왜 금액이 달라졌는지 따라갈 수 있어요. PIN은 매니저만 알고 있어야 해요.", "shop": "프로샵과 스낵바 계산대는 Lightspeed와 같은 첫 화면으로 열려요. New Sale, Continue Sale, Refund 타일이 있고, DS2208 바코드 스캐너나 휴대폰 카메라로 상품을 바로 담을 수 있어요. 새 상품은 바코드 칸에 바코드를 등록해 두면 돼요. 영수증에는 바코드가 찍혀 나와서, 환불할 때 다시 쏘면 그 영수증이 열려요. 티 시트에서 만든 그린피 계산서도 여기서 같이 결제돼요.", "sim": "실내 골프 시뮬레이터는 Bay Sheet에서 세 개의 베이를 시간표로 관리해요. 베이 이용료는 Paid 표시가 아니라 계산서에 담아서 받아요. 손님은 웹이나 전화로 실내 골프를 예약할 수 있고, 문자로 C 다음에 확인번호를 보내면 취소돼요. 전화 예약도 같은 데이터베이스 함수를 거쳐서, 같은 베이를 두 번 팔 수 없어요.", "close": "마감은 두 단계예요. 먼저 계산대마다 Close Register를 열면, 결제수단별로 서랍에 있어야 할 돈이 나와요. 현금은 권종별로, 카드는 단말기 합계로 세고 Submit Counts를 눌러요. 다음으로 직원별 마감에서 근무시간과 팁을 나누고 회계용 엑셀을 받아요. Reports는 티 시트, 실내 골프, 스낵바, 프로샵 네 부문으로 나뉘고, 숫자를 누르면 그 뒤의 계산서까지 내려가 볼 수 있어요.", "more": "그 밖의 메뉴도 짚어 볼게요. Customers는 회원과 손님 명부, Calls and SMS는 AI 전화와 문자 기록이에요. Lost and Found에서 분실물을 Found로 바꾸면 1분 안에 손님에게 문자가 가요. 단, 오전 8시부터 밤 9시 사이에만요. 그리고 Staff Guides에 이런 나레이션 가이드를 모아 두었어요. 계산대 첫 화면, 마감, 카메라 스캔, 바코드 등록법이 있어요.", "arch": "이제 개발 총서예요. 화면은 Next.js로 만든 정적 사이트이고, GitHub main에 푸시하면 Vercel이 자동으로 배포해요. 데이터와 규칙은 Supabase Postgres에 있어요. 브라우저는 pelham으로 시작하는 SQL 함수를 직원 토큰으로 직접 불러요. 카드사와 말하는 Stripe, 전화와 문자를 받는 ElevenLabs와 Twilio 웹훅처럼 바깥과 말하는 일만 Fly.io의 FastAPI 서버가 맡아요.", "data": "데이터 규칙은 몇 가지만 기억하면 돼요. 예약은 한 줄에 JSON 문서 하나로 저장되고, 선수들은 그 안의 배열이에요. 직원 함수는 먼저 직원인지 확인하고, 티타임 잠금을 잡은 뒤 문서를 다시 읽고 고쳐요. 바꾼 내용은 감사 기록에 문장으로 남겨요. 금액은 SQL이 계산하고, 기록할 수 없는 결제 승인은 바로 돌려줘요. 그리고 계산서는 지우지 않아요.", "mig": "데이터베이스는 마이그레이션 파일 0001부터 0026까지로 쌓았어요. 고객과 예약, 직원 티 시트, 계산서, 시뮬레이터, 마감, 레인체크, 결제, 매니저 승인, 공휴일 요금, 추가 품목 순이에요. 실행은 SQL 에디터에 파일 전체를 붙여서 한 번 돌리고, 모든 파일은 다시 실행해도 안전하게 만들어요. 기존 함수를 고칠 때는 이름 뒤에 base를 붙여 옮기고 얇게 감싸요.", "deploy": "배포 순서예요. 화면만 바꿨다면 main에 푸시하는 것으로 끝나요. Vercel 결과는 GitHub 커밋 상태로 확인해요. 단, 빌드가 타입 오류를 무시하니까 푸시 전에 꼭 tsc 노 에밋으로 검사하세요. 백엔드를 바꿨다면 사람이 직접 Fly 배포를 돌려야 하고, SQL은 Supabase SQL 에디터에 붙여서 실행해요. 비밀 키는 채팅이나 코드에 넣지 말고 Fly 시크릿에만 넣어요.", "status": "마지막으로 지금 상황이에요. 결제는 Stripe 테스트 모드와 가상 단말기로 돌고 있어서, 실제 카드를 받으려면 사업자 인증 뒤 라이브 키로 바꿔야 해요. 추가 품목 화면은 배포됐지만, 0026 SQL을 SQL 에디터에서 실행해야 켜져요. 실제 데이터로 환불과 마감을 한 번씩 해 보는 것도 남아 있어요. 여기까지가 총 운영 매뉴얼과 개발 총서였어요. 감사합니다!"}, "en": {"ov": "Hi there! Let me walk you through the complete operations manual and development handbook for the Pelham Hills Golf Club system. The nine scenes after this one are the operations manual staff use every day. The last five are the development handbook for changing and deploying the system. We'll start with the big map: the guest booking site, the staff admin, and the database, payment and voice servers behind them.", "day": "Here's how a day flows. Open the admin in the morning and the tee sheet is the first screen. When golfers arrive, check them in with Arrived, then put green fees, carts and pro shop items on one bill and take payment. Indoor golf runs on the Bay Sheet, and the snack bar has its own register. At closing, count each register with Close Register, split tips in the staff close-out, then check the day's sales in Reports.", "book": "Guests can book four ways. On the website's Book page they pick a tee time or indoor golf and can prepay through Stripe. When they call, the AI assistant Hope answers and books using the caller ID. Texting the word book sends back a booking form. Every booking gets a numeric confirmation number and a check-in barcode by text. Guests change or cancel on their own in My Booking, and freed spots go to the waitlist first.", "tee": "The tee sheet is the heart of operations. Each tee time holds up to four players. Drag a booking to move it, or clone it into the next open tee times. Rates apply automatically by weekday, weekend or holiday, and the plus button on a player card adds a half cart, pull cart or range basket to that player's share. The sheet reloads every five seconds and blocks edits when offline, so two devices never overwrite each other. Carts out on the course show as a red count.", "pay": "Payments follow a one-bill rule. Green fees, carts, pro shop, snack bar and simulator bays all go on the same bill, and the database, not the browser, decides the amount. Cards run through Stripe only: Stripe Checkout online, and the S700 reader at the register. Cash, debit and rain checks work too, and deleting a payment line refunds it. Bills are never deleted. They stay, marked refunded.", "pin": "Risky actions that move money ask for a manager PIN: refunds, issuing rain checks, removing a player, clearing a payment, and changing a green fee or cart fee. When the PIN matches, who approved it and when is written into the booking history. So when you read a report later, you can trace why an amount changed. Only managers should know the PIN.", "shop": "The pro shop and snack bar registers open on a Lightspeed-style home screen with New Sale, Continue Sale and Refund tiles. Add products with the DS2208 barcode scanner or a phone camera. For a new product, just save its barcode in the barcode field. Receipts print with a barcode, so scanning one later opens that receipt for a refund. Green fee bills started on the tee sheet can be paid here too.", "sim": "The indoor golf simulator runs on the Bay Sheet, a timetable for three bays. Bay time is charged on the bill, not with a Paid toggle. Guests book indoor golf on the web or by phone, and texting C followed by the confirmation number cancels it. Phone bookings go through the same database functions, so the same bay can never be sold twice.", "close": "Closing has two steps. First, open Close Register on each register to see what each payment type should have in the drawer. Count cash by denomination and cards from the terminal total, then press Submit Counts. Next, the staff close-out splits hours and tips and gives you the accounting workbook. Reports splits into four divisions, tee sheet, indoor, snack bar and pro shop, and you can tap any number to drill down to the bills behind it.", "more": "A quick tour of the other menus. Customers is the member and guest list, and Calls and SMS holds the AI phone and text history. In Lost and Found, marking an item Found texts the guest within a minute, but only between 8 a.m. and 9 p.m. And Staff Guides collects narrated guides like this one: the register home, closing, camera scan and barcode setup.", "arch": "Now the development handbook. The screens are a static Next.js site, and pushing to the GitHub main branch deploys it to Vercel automatically. Data and rules live in Supabase Postgres. The browser calls SQL functions that start with pelham directly, with a staff token. Only the work that talks to outside services, Stripe for cards and the ElevenLabs and Twilio webhooks for calls and texts, runs on the FastAPI server on Fly.io.", "data": "You only need to remember a few data rules. Each booking is one row holding one JSON document, with the players as an array inside it. Staff functions first check that the caller is staff, take the tee time lock, re-read the document, then change it. Every change is written to the audit history as a sentence. SQL calculates amounts, and a payment approval that can't be recorded is returned right away. And bills are never deleted.", "mig": "The database is built from migration files 0001 through 0026: customers and bookings, the staff tee sheet, bills, the simulator, close-outs, rain checks, payments, manager approval, holiday rates and extras. To run one, paste the whole file into the SQL editor and run it once. Every file is written so it's safe to run again. To change an existing function, rename it with a base suffix and wrap it with a thin new one.", "deploy": "Here's the deploy order. If you only changed screens, pushing to main is enough, and you can watch the Vercel result through the GitHub commit status. The build ignores type errors, so always run tsc with no emit before pushing. If you changed the backend, a person has to run the Fly deploy, and SQL is pasted into the Supabase SQL editor. Never put secret keys in chat or code, only in Fly secrets.", "status": "Finally, where things stand. Payments run in Stripe test mode with a simulated reader, so taking real cards means switching to live keys after business verification. The extras screen is deployed, but it only turns on once the 0026 SQL is run in the SQL editor. One real refund and one real close-out still need to be tried. That's the complete operations manual and development handbook. Thank you!"}};

 ]},

{a:"status",ph:"dev",ko:"지금 상황 · 남은 일",en:"Status · what's left",
 pic:(lg,p)=>'<div class="dev">'+title(T(lg,"현황판 · 2026-10-14","Status board · 2026-10-14"),"4b9b9ac")+
  row(p,T(lg,"돌아가는 것","Working"),[{at:.02,c:"g",t:T(lg,"예약 4가지","4 booking channels")},{at:.04,c:"g",t:T(lg,"티 시트 · 요금","Tee sheet · rates")},{at:.06,c:"g",t:T(lg,"한 계산서","One bill")},{at:.08,c:"g",t:T(lg,"계산대 · 바코드","Registers · barcodes")},{at:.1,c:"g",t:"Bay Sheet"},{at:.12,c:"g",t:T(lg,"마감 · 리포트","Close · reports")}])+
  row(p,T(lg,"사람이 할 일","You do"),[{at:.15,c:"s",t:T(lg,"Stripe 라이브 키","Stripe live keys"),s:T(lg,"사업자 인증 → sk_live → Fly 시크릿","business verification → sk_live → Fly secret"),hot:.45},{at:.45,c:"s",t:T(lg,"0026 SQL 실행","Run 0026 SQL"),s:T(lg,"추가 품목 켜기","turns extras on"),hot:.65}])+
  row(p,T(lg,"남은 확인","Still to check"),[{at:.65,c:"f",t:T(lg,"실제 환불 1회","One real refund"),hot:.8},{at:.7,c:"f",t:T(lg,"실제 마감 1회","One real close-out"),hot:.8}])+'</div>',
 log:[

 ],
 checks:[
  {at:.15,st:"todo",ko:"Stripe 테스트 → 라이브 전환",en:"Switch Stripe test → live"},
  {at:.45,st:"user",ko:"0026 SQL 실행(아직이면)",en:"Run 0026 SQL (if not yet)"},
  {at:.7,st:"todo",ko:"실제 데이터로 환불·마감 한 번씩",en:"One real refund and close-out"},

 ]}
];

/* ---------- state ---------- */
let LANG="ko", SC=0, SPEED=1, playing=false, finished=false, prog=0, runId=0;
let audio=null, t0=0, acc=0, tick=null;
try{const v=localStorage.getItem("phhb-lang");if(v==="en"||v==="ko")LANG=v}catch(e){}
try{const v=parseFloat(localStorage.getItem("phhb-speed"));if([1,1.25,1.5,2].includes(v))SPEED=v}catch(e){}
try{const h=location.hash.slice(1);const i=S.findIndex(s=>s.a===h);if(i>=0)SC=i}catch(e){}

const clip=(l,i)=>"audio/"+l+"-"+S[i].a+".mp3";
const durOf=i=>DUR[S[i].a][LANG]*1000+700;
function fmt(ms){const x=Math.max(0,Math.round(ms/1000));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}

function checksAt(p){const items=S[SC].checks.filter(c=>c.at<=p);return items}
let lastLogN=-1,lastGuestKey="",lastCkN=-1;
const TAGS={ui:"SCREEN",rpc:"SQL",api:"API",ext:"EXTERNAL",ops:"OPS",rule:"RULE"};
function renderLog(p,force){
  const items=S[SC].log.filter(e=>e.at<=p);
  if(!force&&items.length===lastLogN)return;
  const animate=!force&&items.length>lastLogN; lastLogN=items.length;
  if(!items.length){$("log").innerHTML='<p class="empty">'+UI[LANG].waitLog+'</p>';return}
  $("log").innerHTML=items.map((e,i)=>'<div class="ent'+(animate&&i===items.length-1?" new":"")+'"><div class="eh"><span class="tag '+e.tag+'">'+TAGS[e.tag]+'</span><span class="tn">'+esc(typeof e.name==="object"?e.name[LANG]:e.name)+'</span><span class="ep">'+esc(e.ep||"")+'</span></div>'+(e.why?'<p class="why">'+esc(e.why[LANG])+'</p>':"")+'</div>').join("");
  const w=$("logWrap");w.scrollTop=w.scrollHeight;
}
function renderChecks(p,force){
  const items=checksAt(p);
  if(!force&&items.length===lastCkN)return;
  const animate=!force&&items.length>lastCkN; lastCkN=items.length;
  $("ledger").innerHTML=items.length?items.map((c,i)=>'<div class="ck'+(animate&&i===items.length-1?" flash new":"")+'"><span>'+esc(c[LANG])+'</span><span class="pill '+c.st+'">'+UI[LANG].pill[c.st]+'</span></div>').join(""):'<p class="empty">'+UI[LANG].waitLog+'</p>';
}
function renderGuest(p,force){
  const html='<div class="pic">'+S[SC].pic(LANG,p)+'</div>';
  if(!force&&html===lastGuestKey)return; lastGuestKey=html;
  $("gSub").textContent=UI[LANG].part[S[SC].ph]+" · "+S[SC][LANG];
  $("guest").innerHTML=html;
}
function renderStage(p,force){renderGuest(p,force);renderLog(p,force);renderChecks(p,force)}
function renderChips(){
  $("scen").innerHTML=S.map((s,i)=>'<button type="button" class="chip" aria-pressed="'+(i===SC)+'" data-s="'+i+'"><span class="no">'+String(i+1).padStart(2,"0")+'</span><span class="ph '+s.ph+'">'+(s.ph==="ops"?(LANG==="ko"?"운영":"Ops"):s.ph==="dev"?(LANG==="ko"?"개발":"Dev"):(LANG==="ko"?"시작":"Start"))+'</span>'+esc(s[LANG])+'</button>').join("");
  const b=$("scen").querySelector('[aria-pressed="true"]');if(b)b.scrollIntoView({block:"nearest",inline:"nearest"});
}
function renderParts(){
  const P=UI[LANG].part;
  $("parts").innerHTML='<span class="part"><i style="background:var(--sand)"></i>01 '+P.intro+'</span><span class="part"><i style="background:var(--green)"></i>02–10 '+P.ops+'</span><span class="part"><i style="background:var(--blue)"></i>11–15 '+P.dev+'</span>';
  $("legend").innerHTML=["ok","user","todo","tip"].map(k=>'<span class="pill '+k+'">'+UI[LANG].pill[k]+'</span>').join("");
}
function renderCaption(){
  $("stepno").textContent=(SC+1)+" / "+S.length;
  $("capWho").textContent=UI[LANG].narr+" · "+(LANG==="ko"?"한국어":"English");
  $("capIco").setAttribute("href","#i-"+LANG);
  $("capText").textContent=NARR[LANG][S[SC].a];
  $("dots").innerHTML=S.map((_,i)=>'<button type="button" class="dot'+(i<SC?" done":"")+(i===SC?" now":"")+'" data-i="'+i+'" aria-label="'+(i+1)+'"></button>').join("");
}
function renderUI(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=UI[LANG][el.dataset.i]});
  $("h1").innerHTML=UI[LANG].h1;
  document.querySelectorAll("#lang button,#langBig button").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.v===LANG)));
  $("speed").querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked",String(+b.dataset.v===SPEED)));
  renderParts();renderChips();renderCaption();updatePlay();renderStage(prog,true);updateTimes();
}
function updatePlay(){
  $("bPlay").innerHTML=playing?'<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>'+UI[LANG].pause:'<svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg>'+(finished||(SC===0&&prog>=1)?UI[LANG].play:UI[LANG].resume);
  $("cap").classList.toggle("speaking",playing&&$("tVoice").checked);
}
function updateTimes(){
  const sd=durOf(SC);const tot=S.reduce((a,_,i)=>a+durOf(i),0);const before=S.slice(0,SC).reduce((a,_,i)=>a+durOf(i),0);
  const el=before+sd*Math.min(1,prog);
  $("tmScene").textContent=fmt(sd*Math.min(1,prog)/SPEED)+" / "+fmt(sd/SPEED);
  $("tmAll").textContent=fmt(el/SPEED)+" / "+fmt(tot/SPEED);
  $("tmBar").style.width=(100*el/tot).toFixed(2)+"%";
}

/* ---------- player ---------- */
function stopAll(){runId++;if(audio){audio.onended=null;audio.pause();audio=null}clearInterval(tick);tick=null}
function elapsed(){return acc+(playing?(performance.now()-t0)*SPEED:0)}
function startTick(id){
  clearInterval(tick);
  tick=setInterval(()=>{
    if(id!==runId)return;
    const d=durOf(SC);
    let e=elapsed();
    if(audio&&isFinite(audio.duration)&&audio.duration>0&&!audio.paused)e=Math.max(e,audio.currentTime*1000);
    prog=Math.min(1,e/d);
    renderStage(prog,false);updateTimes();
    if(prog>=1&&(!audio||audio.ended||audio.paused))sceneDone(id);
  },120);
}
function sceneDone(id){
  if(id!==runId)return;
  stopAll();playing=false;prog=1;renderStage(1,false);
  const rid=runId;
  if($("tAll").checked&&SC<S.length-1){setTimeout(()=>{if(rid===runId&&!playing)playScene(SC+1,0)},900/SPEED)}
  else{finished=SC===S.length-1;}
  updatePlay();updateTimes();
}
function playScene(i,fromProg){
  stopAll();const id=runId;
  SC=i;finished=false;prog=fromProg||0;acc=prog*durOf(SC);t0=performance.now();playing=true;
  lastLogN=-1;lastGuestKey="";lastCkN=-1;
  renderChips();renderCaption();renderStage(prog,true);updatePlay();updateTimes();
  if($("tVoice").checked){
    const a=new Audio(clip(LANG,SC));a.playbackRate=SPEED;a.preservesPitch=true;audio=a;
    a.addEventListener("loadedmetadata",()=>{if(id!==runId)return;const sec=a.duration;if(isFinite(sec)&&sec>0){DUR[S[SC].a][LANG]=sec;}if(fromProg)try{a.currentTime=Math.min(sec-0.1,fromProg*sec)}catch(e){}updateTimes()},{once:true});
    a.onended=()=>{if(id!==runId)return;acc=Math.max(elapsed(),durOf(SC)-700);t0=performance.now()};
    a.onerror=()=>{if(id===runId){audio=null}};
    a.play().catch(()=>{if(id===runId)audio=null});
  }
  startTick(id);
}
function pause(){acc=elapsed();if(audio)audio.pause();playing=false;clearInterval(tick);tick=null;updatePlay();updateTimes()}
function resume(){
  if(prog>=1||finished){playScene(finished?0:SC,0);return}
  if(audio&&audio.paused){playing=true;t0=performance.now();audio.play().catch(()=>{});startTick(runId);updatePlay();return}
  playScene(SC,prog);
}
function show(i){stopAll();playing=false;finished=false;SC=i;prog=1;lastLogN=-1;lastGuestKey="";lastCkN=-1;renderChips();renderCaption();renderStage(1,true);updatePlay();updateTimes()}
function setLang(l){
  if(l===LANG)return;
  const was=playing;LANG=l;try{localStorage.setItem("phhb-lang",l)}catch(e){}
  if(was){playScene(SC,0)}else{stopAll()}
  renderUI();
}
function setSpeed(v){
  if(v===SPEED)return;
  if(playing){acc=elapsed();t0=performance.now()}
  SPEED=v;if(audio)audio.playbackRate=v;
  try{localStorage.setItem("phhb-speed",String(v))}catch(e){}
  $("speed").querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked",String(+b.dataset.v===v)));
  updateTimes();
}

$("bPlay").addEventListener("click",()=>{if(playing)pause();else if(prog>=1&&!finished)playScene(SC,0);else resume()});
$("bRestart").addEventListener("click",()=>playScene(0,0));
$("bNext").addEventListener("click",()=>{const n=Math.min(SC+1,S.length-1);if(playing)playScene(n,0);else show(n)});
$("bPrev").addEventListener("click",()=>{const n=Math.max(SC-1,0);if(playing)playScene(n,0);else show(n)});
$("scen").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;const n=+b.dataset.s;if(playing)playScene(n,0);else show(n)});
$("dots").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;const n=+b.dataset.i;if(playing)playScene(n,0);else show(n)});
$("lang").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setLang(b.dataset.v)});
$("langBig").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setLang(b.dataset.v)});
$("speed").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setSpeed(+b.dataset.v)});
$("tVoice").addEventListener("change",()=>{if(!$("tVoice").checked&&audio){audio.pause();audio=null}updatePlay()});
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();$("bPlay").click()}
  else if(e.key==="ArrowRight")$("bNext").click();
  else if(e.key==="ArrowLeft")$("bPrev").click();
  else if(e.key==="l"||e.key==="L")setLang(LANG==="ko"?"en":"ko");
});

prog=1;renderUI();
})();
</script>
