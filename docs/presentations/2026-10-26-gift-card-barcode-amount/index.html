<title>Gift Card Barcode and Amounts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one presenter column — header, scene chips, two-lane stage (picture · key points), dark narration band, player bar */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#1c2420; --muted:#5d6a62; --line:#d6ddd6;
  --green:#1a7f4b; --green-soft:#dcefe3; --gold:#b7791f; --gold-soft:#f8ecd6; --red:#b4412f;
  --band:#14201a; --band-ink:#e9f2ec; --band-muted:#9fb5a8;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:7px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--sans);padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.chip[aria-current="true"] b{color:var(--green)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;min-height:400px}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0;display:grid;align-content:start;gap:12px}
.lane h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
.lane .lt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.pts li i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--green);padding-top:2px}
.band{background:var(--band);color:var(--band-ink);padding:14px 16px;min-height:96px;display:grid;gap:4px}
.band .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
.band p{margin:0;font-size:16px;line-height:1.6}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--sans);min-height:44px;min-width:44px;padding:0 14px;cursor:pointer}
.pbtn.main{background:var(--green);border-color:var(--green);color:#fff;min-width:120px}
.bar{flex:1 1 160px;height:6px;background:var(--line);position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--green);width:0}
.speed{font:500 13px var(--sans);color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;background:var(--gold-soft);color:var(--gold)}
.tag.ok{background:var(--green-soft);color:var(--green)}
/* scene visuals */
.mock{border:1px solid var(--line);display:grid}
.mock .mh{padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.mock .mb{padding:10px;display:grid;gap:8px}
.mta{border:1px solid var(--line);padding:8px;color:var(--muted);font-size:13px;min-height:52px}
.mbtn{justify-self:start;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 12px}
.msec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.msec div{border:1px dashed var(--line);padding:8px;font-size:12px;color:var(--muted)}
.msec div b{display:block;color:var(--ink);font-size:13px}
.tw{overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;min-width:460px;font-size:13px;font-variant-numeric:tabular-nums}
table.hm th{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
table.hm th.r{text-align:left;color:var(--ink);font-size:13px;white-space:nowrap}
table.hm td{text-align:center;padding:6px 2px;font-weight:600}
table.hm td.empty{outline:2px dashed var(--gold);outline-offset:-2px}
.chart{display:grid;gap:8px}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13px}
.row .t{height:16px;background:var(--line)}
.row .t span{display:block;height:100%;background:var(--green)}
.row.hl .t span{background:var(--gold)}
.row .v{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.stack{display:flex;height:34px}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.offer{border:1px solid var(--green);background:var(--green-soft);padding:10px;display:grid;gap:4px;font-size:13px}
.offer b{font-size:14px}
.code{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:1px 6px}
.ladder{position:relative;height:210px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 4px 22px 4px}
.ladder .zone{position:absolute;top:0;bottom:0;background:var(--gold-soft)}
.ladder .zone em{position:absolute;top:4px;left:6px;font-style:normal;font-size:11px;font-weight:700;color:var(--gold)}
.ladder .pin{position:absolute;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;font-size:11px;white-space:nowrap}
.ladder .pin s{display:block;width:10px;height:10px;border-radius:50%;background:var(--green);text-decoration:none}
.ladder .pin.h s{background:var(--gold)}
.ladder .tick{position:absolute;bottom:-20px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-family:var(--mono)}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.plan{grid-template-columns:minmax(0,1fr)}}
.plan div{border:1px solid var(--line);padding:10px;display:grid;gap:6px;align-content:start;font-size:13px}
.plan h3{margin:0;font-size:14px}
.plan ul{margin:0;padding-left:18px;display:grid;gap:4px}
.check{display:grid;gap:8px}
.check div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);padding:10px;font-size:14px}
/* gift card barcode · amount mocks — admin screen is white paper, so barcodes always sit on white */
.gc-bc{background:#fff;padding:6px 10px;border:1px solid var(--line)}
.gc-bc svg{display:block;width:100%;height:44px;fill:#000}
.gc-bc.sm svg{height:26px}
.gc-bc.lg svg{height:72px}
.gc-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.gc-three{grid-template-columns:minmax(0,1fr)}}
.gc-tile{border:1px solid var(--line);padding:10px;display:grid;gap:8px;align-content:start;font-size:13px}
.gc-tile.no{border:2px dashed var(--red)}
.gc-empty{height:40px;display:grid;place-items:center;border:1px dashed var(--line);color:var(--red);font:700 20px var(--mono)}
.gc-two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:560px){.gc-two{grid-template-columns:minmax(0,1fr)}}
.gc-scr{border:6px solid var(--ink);border-radius:8px;padding:8px;display:grid;gap:6px;background:var(--bg);font-size:12px}
.gc-cap{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.gc-view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:6px}
.gc-scr.narrow .gc-view{grid-template-columns:minmax(0,1fr)}
.gc-form,.gc-list{border:1px solid var(--line);background:var(--panel);padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.gc-in{border:1px solid var(--line);padding:3px 6px;font-family:var(--mono)}
.gc-go{background:var(--green);color:#fff;font-weight:700;padding:4px 8px;justify-self:start}
.gc-row{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:11px}
.gc-row i{font-style:normal;font-family:var(--sans);color:var(--green);font-weight:700}
.gc-scr.narrow .gc-list{opacity:.4;border-style:dashed}
.gc-fold{border-top:2px dashed var(--red);padding-top:4px;color:var(--red);font-weight:700;font-size:11px}
.gc-scr.narrow{position:relative}
.gc-just{border:2px solid var(--green);background:var(--green-soft);padding:6px;display:grid;gap:4px}
.gc-just code,.gc-card code{font-family:var(--mono);font-size:11px;text-align:center}
.gc-big{display:grid;place-items:center;padding:12px 0}
.gc-card{width:340px;max-width:100%;border:2px solid var(--green);background:var(--green-soft);padding:12px;display:grid;gap:8px;justify-items:stretch}
.gc-card small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.gc-btn{justify-self:center;border:1px solid var(--line);background:var(--panel);padding:4px 10px;font-size:12px;font-weight:700}
.gc-sum{display:grid;gap:14px}
.gc-chips{display:flex;flex-wrap:wrap;gap:6px}
.gc-chips span{border:1px solid var(--line);background:var(--panel);padding:5px 10px;font:700 13px var(--mono)}
.gc-chips span.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.gc-chips span.clr{font-family:var(--sans);color:var(--muted)}
.gc-eq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.gc-eq span{border:1px solid var(--line);padding:8px 12px;font:700 18px var(--mono)}
.gc-eq span.on{border-color:var(--green);color:var(--green)}
.gc-eq i{font-style:normal;font-size:20px;color:var(--muted)}
.gc-eq b{font:700 30px var(--mono);color:var(--green)}
.gc-was{font-size:13px;color:var(--muted)}
.gc-check{display:grid;gap:8px}
.gc-check div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);padding:10px;font-size:14px}
.tag.no{background:color-mix(in srgb,var(--red) 14%,var(--panel));color:var(--red)}
select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.lane{animation:in .35s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<script>
const NARR = {"ko": ["기프트카드를 발행했는데 바코드가 안 보인다는 질문이었습니다. 바코드는 만들어지고 있었습니다. 인쇄되는 카드에도, 손님에게 가는 문자에도 들어 있습니다. 문제는 화면에서 바코드가 보이는 자리였습니다.", "바코드는 오른쪽 카드 목록 안에 있었고, Barcode and history 를 눌러 펼쳐야 보였습니다. 화면이 넓으면 목록이 폼 옆에 있습니다. 하지만 폭이 1280 픽셀보다 좁은 태블릿이나 노트북에서는 목록이 폼 아래로 내려가서, 발행한 뒤에 바코드가 화면 밖에 있었습니다.", "이제 발행하면 폼 바로 아래 Just issued 칸에 그 카드의 바코드가 나옵니다. 카드 번호와 금액이 같이 보이고, Reprint 버튼으로 다시 찍을 수 있습니다. 화면 폭과 상관없이 발행 버튼 바로 밑입니다.", "금액 버튼도 바꿨습니다. 예전에는 누른 금액으로 바뀌었는데, 이제는 누를 때마다 더해집니다. 50달러, 50달러, 25달러를 누르면 125달러입니다. 잘못 눌렀으면 Clear 로 비우고, 입력칸에 직접 적어도 됩니다.", "고친 파일은 관리자 기프트카드 화면 하나입니다. 이 파일에는 린트와 타입 오류가 없습니다. 아직 브라우저에서 직접 눌러 보지 않았고, 커밋과 배포도 하지 않았습니다. 배포한 뒤 카드 한 장으로 확인해 주세요."], "en": ["The question was why the barcode does not show when a gift card is issued. The barcode was being made. It is on the printed card and in the text to the guest. The problem was where the screen showed it.", "The barcode sat inside the card list on the right, and only after you opened Barcode and history. On a wide screen the list is beside the form. On a tablet or laptop narrower than 1280 pixels, the list drops below the form, so after issuing, the barcode was off the screen.", "Now, right after issuing, a Just issued box under the form shows that card's barcode, with the card number and the value, and a Reprint button. It sits right under the Issue button at any screen width.", "The amount buttons changed too. They used to replace the amount. Now each tap adds to it. Fifty, fifty, then twenty-five makes one hundred twenty-five dollars. Clear empties it if you tap the wrong one, and you can still type an amount.", "One file changed, the admin gift cards page. It has no lint or type errors. It has not been clicked through in a browser yet, and it is not committed or deployed. After deploying, please check it with one card."]};

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, playing = false, timer = null;

// 속도·피치는 AI 매니저(StrategyDeck)와 같은 열쇠·모양으로 기억한다: {tone, speed, pitch}.
// 소리는 ElevenLabs Hope 가 natural · 1× 로 미리 만든 것이고, 속도는 <audio> 재생 속도(음높이 유지),
// 피치는 Web Audio 피치 시프터(반음 ±4)가 바꾼다.
const VOICE_KEY = "pelham-narration-voice";
let voice = { tone: "natural", speed: 1, pitch: 0 };
try { const v = JSON.parse(localStorage.getItem(VOICE_KEY) || "null"); if (v) voice = { ...voice, ...v }; } catch (e) {}
$("speed").value = String(voice.speed); if (!$("speed").value) $("speed").value = "1";
$("pitch").value = String(voice.pitch); if (!$("pitch").value) $("pitch").value = "0";
function saveVoice() {
  voice = { ...voice, speed: Number($("speed").value), pitch: Number($("pitch").value) };
  try { localStorage.setItem(VOICE_KEY, JSON.stringify(voice)); } catch (e) {}
}

const PITCH_WORKLET = `
class PelhamPitch extends AudioWorkletProcessor {
  static get parameterDescriptors() { return [{ name: "ratio", defaultValue: 1, minValue: 0.5, maxValue: 2 }]; }
  constructor() { super(); this.win = Math.round(sampleRate * 0.05); this.len = this.win * 2 + 4; this.buf = []; this.w = 0; this.phase = 0; }
  read(b, d) { let pos = this.w - d; while (pos < 0) pos += this.len; const i = Math.floor(pos); const f = pos - i; return b[i] * (1 - f) + b[(i + 1) % this.len] * f; }
  process(inputs, outputs, params) {
    const input = inputs[0] || [], output = outputs[0], ratio = params.ratio[0];
    for (let c = 0; c < output.length; c++) if (!this.buf[c]) this.buf[c] = new Float32Array(this.len);
    for (let i = 0; i < output[0].length; i++) {
      const p1 = this.phase, p2 = (p1 + 0.5) % 1;
      const g1 = Math.sin(Math.PI * p1) ** 2, g2 = Math.sin(Math.PI * p2) ** 2;
      for (let c = 0; c < output.length; c++) {
        const src = input[c] || input[0];
        const x = src ? src[i] : 0;
        const b = this.buf[c];
        b[this.w] = x;
        output[c][i] = ratio === 1 ? x : this.read(b, p1 * this.win + 1) * g1 + this.read(b, p2 * this.win + 1) * g2;
      }
      this.w = (this.w + 1) % this.len;
      this.phase += (1 - ratio) / this.win;
      if (this.phase >= 1) this.phase -= 1;
      if (this.phase < 0) this.phase += 1;
    }
    return true;
  }
}
registerProcessor("pelham-pitch", PelhamPitch);
`;
// 피치를 처음 0 이 아닌 값으로 둘 때만 그래프를 잇는다 — file:// 로 열면 Web Audio 가 소리를 막으므로 그때는 쓰지 않는다.
let graph = null, graphTried = false;
const ratioOf = (semi) => 2 ** (semi / 12);
async function ensureGraph() {
  if (graph || graphTried || location.protocol === "file:") return graph;
  graphTried = true;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const context = new Ctx();
    await context.audioWorklet.addModule(URL.createObjectURL(new Blob([PITCH_WORKLET], { type: "application/javascript" })));
    const node = new AudioWorkletNode(context, "pelham-pitch", { outputChannelCount: [2] });
    context.createMediaElementSource(audio).connect(node).connect(context.destination);
    graph = { context, node };
  } catch (e) { graph = null; }
  return graph;
}
async function applyPitch() {
  const semi = Number($("pitch").value);
  if (semi === 0 && !graph) return;
  const g = await ensureGraph();
  if (!g) { $("pitch").value = "0"; $("pitch").disabled = true; $("pitch").title = T(UI.nopitch); return; }
  g.context.resume();
  g.node.parameters.get("ratio").setValueAtTime(ratioOf(semi), g.context.currentTime);
}
function applySpeed() { audio.preservesPitch = true; audio.playbackRate = Number($("speed").value); }

function renderUI() {
  $("eyebrow").textContent = T(UI.eyebrow); $("title").textContent = T(UI.title); $("sub").textContent = T(UI.sub);
  $("who").textContent = T(UI.who); $("speedL").textContent = T(UI.speed) + " "; $("pitchL").textContent = T(UI.pitch) + " ";
  $("foot").textContent = T(UI.foot); $("keyhint").textContent = T(UI.keyhint);
  $("play").textContent = playing ? T(UI.pause) : T(UI.play);
  $("lang-ko").setAttribute("aria-pressed", LANG === "ko"); $("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.documentElement.lang = LANG;
  $("chips").innerHTML = S.map((s, i) => `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}"><b>${i + 1}</b>${T(s.n)}</button>`).join("");
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $("stage").innerHTML = `<div class="lane"><div class="lt">${T(UI.pic)}</div><h2>${T(s.h)}</h2>${s.pic()}</div>
    <div class="lane"><div class="lt">${T(UI.keys)}</div><ul class="pts">${s.pts.map((p, k) => `<li><i>${k + 1}</i><span>${T(p)}</span></li>`).join("")}</ul></div>`;
  $("narr").textContent = NARR[LANG][cur];
  $("prog").style.width = "0";
  renderUI();
}

function stopAudio() { audio.pause(); clearInterval(timer); }
function playScene() {
  stopAudio();
  audio.src = `audio/${LANG}/s${cur + 1}.mp3`;
  applySpeed();
  if (graph) graph.context.resume();
  const p = audio.play();
  if (p && p.catch) p.catch(() => { playing = false; renderUI(); });
  timer = setInterval(() => {
    const d = audio.duration || DUR[LANG][cur] || 1;
    $("prog").style.width = `${Math.min(100, (audio.currentTime / d) * 100)}%`;
  }, 200);
}
audio.addEventListener("ended", () => {
  clearInterval(timer); $("prog").style.width = "100%";
  if (playing && cur < S.length - 1) setTimeout(() => { if (playing) { show(cur + 1); playScene(); } }, 700);
  else { playing = false; renderUI(); }
});
$("play").onclick = () => { playing = !playing; if (playing) { applyPitch(); playScene(); } else stopAudio(); renderUI(); };
$("prev").onclick = () => { show(cur - 1); if (playing) playScene(); };
$("next").onclick = () => { show(cur + 1); if (playing) playScene(); };
$("chips").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; show(Number(b.dataset.i)); if (playing) playScene(); };
$("speed").onchange = () => { saveVoice(); applySpeed(); };
$("pitch").onchange = () => { saveVoice(); applyPitch(); };
function setLang(l) { LANG = l; try { localStorage.setItem("pelham-deck-lang", l); } catch (e) {} show(cur); if (playing) playScene(); }
$("lang-ko").onclick = () => setLang("ko");
$("lang-en").onclick = () => setLang("en");

// 한/영 키: Windows 한글 키보드는 HangulMode(Lang1), Mac 은 Caps Lock 으로 입력 소스를 바꾸는 경우가 많다.
// Caps Lock 은 누름·뗌이 둘 다 올 수 있어 0.4초 안의 두 번째는 무시한다. L 키도 같다.
let lastToggle = 0;
function toggleLang() { const now = Date.now(); if (now - lastToggle < 400) return; lastToggle = now; setLang(LANG === "ko" ? "en" : "ko"); }
const isHanEng = (e) => e.key === "HangulMode" || e.code === "Lang1" || e.key === "CapsLock";
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("select")) return;
  if (isHanEng(e) || ((e.key === "l" || e.key === "L" || e.key === "ㅣ") && !e.metaKey && !e.ctrlKey && !e.altKey)) { toggleLang(); return; }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === " " && !(e.target.closest && e.target.closest("button"))) { e.preventDefault(); $("play").click(); }
});
document.addEventListener("keyup", (e) => { if (e.key === "CapsLock") toggleLang(); });
show(0);
</script>
