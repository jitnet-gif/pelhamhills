<style>
/* Layout: one presenter column — header, scene chips, two-lane stage (picture · key points), dark narration band, player bar */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#1c2420; --muted:#5d6a62; --line:#d6ddd6;
  --green:#1a7f4b; --green-soft:#dcefe3; --gold:#b7791f; --gold-soft:#f8ecd6; --red:#b4412f;
  --band:#14201a; --band-ink:#e9f2ec; --band-muted:#9fb5a8;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:7px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.chip b{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.chip[aria-current="true"] b{color:var(--green)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;min-height:400px}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0;display:grid;align-content:start;gap:12px}
.lane h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
.lane .lt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.pts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}

.tag.ok{background:var(--green-soft);color:var(--green)}
/* scene visuals */
.mock{border:1px solid var(--line);display:grid}

.mock .mb{padding:10px;display:grid;gap:8px}
.mta{border:1px solid var(--line);padding:8px;color:var(--muted);font-size:13px;min-height:52px}
.mbtn{justify-self:start;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 12px}
.msec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.msec div{border:1px dashed var(--line);padding:8px;font-size:12px;color:var(--muted)}

.chart{display:grid;gap:8px}

.ladder .zone{position:absolute;top:0;bottom:0;background:var(--gold-soft)}

.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.gc-row{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:11px}

.gc-scr.narrow .gc-list{opacity:.4;border-style:dashed}
.gc-fold{border-top:2px dashed var(--red);padding-top:4px;color:var(--red);font-weight:700;font-size:11px}
.gc-scr.narrow{position:relative}
.gc-just{border:2px solid var(--green);background:var(--green-soft);padding:6px;display:grid;gap:4px}

.gc-chips span{border:1px solid var(--line);background:var(--panel);padding:5px 10px;font:700 13px var(--mono)}

.gc-was{font-size:13px;color:var(--muted)}
.gc-check{display:grid;gap:8px}
.gc-check div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);padding:10px;font-size:14px}
.tag.no{background:color-mix(in srgb,var(--red) 14%,var(--panel));color:var(--red)}
select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
/* web Charlie booking fix — chat + tool timeline mocks */
.wc-chat{display:grid;gap:6px;font-size:13px}
.wc-b{max-width:88%;padding:7px 10px;border:1px solid var(--line);background:var(--panel)}
.wc-b.me{justify-self:end;background:var(--green-soft);border-color:var(--green)}
.wc-b.bad{border:2px solid var(--red)}
.wc-b small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.wc-tl{display:grid;gap:6px}
.wc-step{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:8px;align-items:center;border:1px solid var(--line);padding:8px;font-size:13px;background:var(--panel)}
@media (max-width:560px){.wc-step{grid-template-columns:minmax(0,1fr) 64px}.wc-step span:nth-child(2){grid-column:1/-1;order:3}}
.wc-step code{font-family:var(--mono);font-size:12px}
.wc-step.no{border:2px solid var(--red)}
.wc-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.wc-two{grid-template-columns:minmax(0,1fr)}}
.wc-card{border:1px solid var(--line);padding:10px;display:grid;gap:6px;align-content:start;font-size:13px;background:var(--panel)}
.wc-card.no{border:2px solid var(--red)}
.wc-card.ok{border:2px solid var(--green)}
.wc-card pre{margin:0;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:6px;border:1px solid var(--line)}
.wc-card h4{margin:0;font-size:13px}
.wc-err{font-family:var(--mono);font-size:11.5px;color:var(--red);border:1px dashed var(--red);padding:6px}
@media (prefers-reduced-motion:no-preference){.lane{animation:in .35s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<script>
const NARR = {"ko": ["웹사이트에서 Charlie 로 예약하면 시간은 잡히는데 예약이 끝나지 않았습니다. 이름과 전화번호까지 받은 뒤 시스템 문제가 있다는 말만 반복하고, 웹에서는 할 수 없는 프로샵 연결을 시도했습니다.", "실제 웹 세션을 글자로 끝까지 돌려 봤습니다. 빈 시간 찾기와 자리 잡기는 정상이었습니다. 예약 확정만 네 번 모두 거절됐습니다. 서버 기록을 보면 확정 요청이 데이터베이스에 닿기도 전에 끝났습니다.", "원인은 발신번호였습니다. 전화는 전화선이 번호를 채워 주지만, 웹에는 발신번호가 없어서 빈 값으로 왔습니다. 서버는 이것을 형식 오류로 보고 거절했습니다. 손님이 고칠 수 없는 칸이라 Charlie 는 같은 말만 반복했습니다.", "모든 음성 도구가 함께 쓰는 입구에서, 비어 온 발신번호를 빈 값으로 받게 고쳤습니다. 예약에는 손님이 말한 전화번호가 쓰입니다. 수정 전에는 새 테스트가 같은 오류로 실패했고, 수정 후에는 테스트 134개가 모두 통과했습니다.", "웹 Charlie 는 이제 프로샵 연결을 하지 않습니다. 프로샵 번호도 안내하지 않고, 직접 처리할 수 없는 일은 콜백 요청으로 받습니다. 전화로 온 손님은 지금처럼 연결할 수 있습니다.", "푸시하고 Fly 에 배포한 뒤, 실제 웹 세션으로 다시 시험했습니다. 8시 10분, 두 명, 카트로 예약이 확정되고 확인번호가 나왔습니다. 시험 예약은 바로 취소해서 티 시트에 남아 있지 않습니다.", "남은 일은 하나입니다. 프로샵 연결 금지 규칙을 Charlie 에 실제로 적용하는 단계가 자동 모드에 막혀 승인이 필요합니다. 그리고 대시보드 워크플로가 회원 질문을 건너뛰는 문제는 다음에 손볼 부분입니다."], "en": ["When guests booked with Charlie on the website, the time got held but the booking never finished. After taking the name and phone number, Charlie kept saying there was a system problem, then tried a pro shop transfer the website can't do.", "I ran a real web session end to end in text. Finding times and holding a time worked. Only the confirmation was refused, all four tries. The server log shows the confirm request ended before it ever reached the database.", "The cause was the caller ID. On the phone, the line fills in the number. The website has none, so it arrived empty, and the server refused it as a bad field. The guest can't fix that field, so Charlie just repeated itself.", "At the shared entry for every voice tool, a missing caller ID is now taken as blank, and the booking uses the number the guest says. Before the fix the new test failed with the same error; after it, all 134 tests pass.", "Web Charlie no longer transfers to the pro shop or reads out its number. Anything it can't handle becomes a callback request. Phone callers can still be transferred as before.", "After pushing and deploying to Fly, I tested again with a real web session. Eight ten, two players, with a cart, confirmed with a code. The test booking was cancelled right away, so nothing is left on the tee sheet.", "One step is left. Applying the no-transfer rule to Charlie is blocked by auto mode and needs your approval. And the dashboard workflow skipping the member question is the next thing to fix."]};
const DUR = {"ko": [], "en": []};
let LANG = "ko";
try { const s = localStorage.getItem("pelham-deck-lang"); if (s === "en" || s === "ko") LANG = s; } catch (e) {}
const T = (o) => (typeof o === "string" ? o : o[LANG]);

const UI = {

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, playing = false, timer = null;

// 속도·피치는 AI 매니저(StrategyDeck)와 같은 열쇠·모양으로 기억한다: {tone, speed, pitch}.
// 소리는 ElevenLabs Hope 가 natural · 1× 로 미리 만든 것이고, 속도는 <audio> 재생 속도(음높이 유지),
// 피치는 Web Audio 피치 시프터(반음 ±4)가 바꾼다.
const VOICE_KEY = "pelham-narration-voice";
let voice = { tone: "natural", speed: 1, pitch: 0 };
try { const v = JSON.parse(localStorage.getItem(VOICE_KEY) || "null"); if (v) voice = { ...voice, ...v }; } catch (e) {}
$("speed").value = String(voice.speed); if (!$("speed").value) $("speed").value = "1";
$("pitch").value = String(voice.pitch); if (!$("pitch").value) $("pitch").value = "0";
function saveVoice() {
  voice = { ...voice, speed: Number($("speed").value), pitch: Number($("pitch").value) };
  try { localStorage.setItem(VOICE_KEY, JSON.stringify(voice)); } catch (e) {}
}

const PITCH_WORKLET = `
class PelhamPitch extends AudioWorkletProcessor {
  static get parameterDescriptors() { return [{ name: "ratio", defaultValue: 1, minValue: 0.5, maxValue: 2 }]; }
  constructor() { super(); this.win = Math.round(sampleRate * 0.05); this.len = this.win * 2 + 4; this.buf = []; this.w = 0; this.phase = 0; }
  read(b, d) { let pos = this.w - d; while (pos < 0) pos += this.len; const i = Math.floor(pos); const f = pos - i; return b[i] * (1 - f) + b[(i + 1) % this.len] * f; }
  process(inputs, outputs, params) {
    const input = inputs[0] || [], output = outputs[0], ratio = params.ratio[0];
    for (let c = 0; c < output.length; c++) if (!this.buf[c]) this.buf[c] = new Float32Array(this.len);
    for (let i = 0; i < output[0].length; i++) {
      const p1 = this.phase, p2 = (p1 + 0.5) % 1;
      const g1 = Math.sin(Math.PI * p1) ** 2, g2 = Math.sin(Math.PI * p2) ** 2;
      for (let c = 0; c < output.length; c++) {
        const src = input[c] || input[0];
        const x = src ? src[i] : 0;
        const b = this.buf[c];
        b[this.w] = x;
        output[c][i] = ratio === 1 ? x : this.read(b, p1 * this.win + 1) * g1 + this.read(b, p2 * this.win + 1) * g2;
      }
      this.w = (this.w + 1) % this.len;
      this.phase += (1 - ratio) / this.win;
      if (this.phase >= 1) this.phase -= 1;
      if (this.phase < 0) this.phase += 1;
    }
    return true;
  }
}
registerProcessor("pelham-pitch", PelhamPitch);
`;
// 피치를 처음 0 이 아닌 값으로 둘 때만 그래프를 잇는다 — file:// 로 열면 Web Audio 가 소리를 막으므로 그때는 쓰지 않는다.
let graph = null, graphTried = false;
const ratioOf = (semi) => 2 ** (semi / 12);
async function ensureGraph() {
  if (graph || graphTried || location.protocol === "file:") return graph;
  graphTried = true;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const context = new Ctx();
    await context.audioWorklet.addModule(URL.createObjectURL(new Blob([PITCH_WORKLET], { type: "application/javascript" })));
    const node = new AudioWorkletNode(context, "pelham-pitch", { outputChannelCount: [2] });
    context.createMediaElementSource(audio).connect(node).connect(context.destination);
    graph = { context, node };
  } catch (e) { graph = null; }
  return graph;
}
async function applyPitch() {
  const semi = Number($("pitch").value);
  if (semi === 0 && !graph) return;
  const g = await ensureGraph();
  if (!g) { $("pitch").value = "0"; $("pitch").disabled = true; $("pitch").title = T(UI.nopitch); return; }
  g.context.resume();
  g.node.parameters.get("ratio").setValueAtTime(ratioOf(semi), g.context.currentTime);
}
function applySpeed() { audio.preservesPitch = true; audio.playbackRate = Number($("speed").value); }

function renderUI() {
  $("eyebrow").textContent = T(UI.eyebrow); $("title").textContent = T(UI.title); $("sub").textContent = T(UI.sub);
  $("who").textContent = T(UI.who); $("speedL").textContent = T(UI.speed) + " "; $("pitchL").textContent = T(UI.pitch) + " ";
  $("foot").textContent = T(UI.foot); $("keyhint").textContent = T(UI.keyhint);
  $("play").textContent = playing ? T(UI.pause) : T(UI.play);
  $("lang-ko").setAttribute("aria-pressed", LANG === "ko"); $("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.documentElement.lang = LANG;
  $("chips").innerHTML = S.map((s, i) => `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}"><b>${i + 1}</b>${T(s.n)}</button>`).join("");
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $("stage").innerHTML = `<div class="lane"><div class="lt">${T(UI.pic)}</div><h2>${T(s.h)}</h2>${s.pic()}</div>
    <div class="lane"><div class="lt">${T(UI.keys)}</div><ul class="pts">${s.pts.map((p, k) => `<li><i>${k + 1}</i><span>${T(p)}</span></li>`).join("")}</ul></div>`;
  $("narr").textContent = NARR[LANG][cur];
  $("prog").style.width = "0";
  renderUI();
}

// ElevenLabs 크레딧이 바닥나(2026-10-26) 이 발표는 브라우저 음성으로 읽는다.
let utter = null;
function stopAudio() { clearInterval(timer); utter = null; try { speechSynthesis.cancel(); } catch (e) {} }
function playScene() {
  stopAudio();
  if (!("speechSynthesis" in window)) { playing = false; renderUI(); return; }
  const u = new SpeechSynthesisUtterance(NARR[LANG][cur]);
  u.lang = LANG === "ko" ? "ko-KR" : "en-US";
  u.rate = Number($("speed").value) || 1;
  u.pitch = Math.max(0, Math.min(2, 1 + Number($("pitch").value || 0) / 12));
  const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.replace("_", "-").startsWith(u.lang));
  if (v) u.voice = v;
  const start = Date.now(), est = (NARR[LANG][cur].length / (LANG === "ko" ? 7 : 15)) / u.rate;
  timer = setInterval(() => { $("prog").style.width = `${Math.min(100, ((Date.now() - start) / 1000 / est) * 100)}%`; }, 200);
  u.onend = () => {
    if (utter !== u) return;
    clearInterval(timer); $("prog").style.width = "100%";
    if (playing && cur < S.length - 1) setTimeout(() => { if (playing) { show(cur + 1); playScene(); } }, 700);
    else { playing = false; renderUI(); }
  };
  utter = u;
  speechSynthesis.speak(u);
}
$("play").onclick = () => { playing = !playing; if (playing) { playScene(); } else stopAudio(); renderUI(); };
$("prev").onclick = () => { show(cur - 1); if (playing) playScene(); };
$("next").onclick = () => { show(cur + 1); if (playing) playScene(); };
$("chips").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; show(Number(b.dataset.i)); if (playing) playScene(); };
$("speed").onchange = () => { saveVoice(); if (playing) playScene(); };
$("pitch").onchange = () => { saveVoice(); if (playing) playScene(); };
function setLang(l) { LANG = l; try { localStorage.setItem("pelham-deck-lang", l); } catch (e) {} show(cur); if (playing) playScene(); }
$("lang-ko").onclick = () => setLang("ko");
$("lang-en").onclick = () => setLang("en");

// 한/영 키: Windows 한글 키보드는 HangulMode(Lang1), Mac 은 Caps Lock 으로 입력 소스를 바꾸는 경우가 많다.
// Caps Lock 은 누름·뗌이 둘 다 올 수 있어 0.4초 안의 두 번째는 무시한다. L 키도 같다.
let lastToggle = 0;
function toggleLang() { const now = Date.now(); if (now - lastToggle < 400) return; lastToggle = now; setLang(LANG === "ko" ? "en" : "ko"); }
const isHanEng = (e) => e.key === "HangulMode" || e.code === "Lang1" || e.key === "CapsLock";
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("select")) return;
  if (isHanEng(e) || ((e.key === "l" || e.key === "L" || e.key === "ㅣ") && !e.metaKey && !e.ctrlKey && !e.altKey)) { toggleLang(); return; }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === " " && !(e.target.closest && e.target.closest("button"))) { e.preventDefault(); $("play").click(); }
});
document.addEventListener("keyup", (e) => { if (e.key === "CapsLock") toggleLang(); });
show(0);
</script>
