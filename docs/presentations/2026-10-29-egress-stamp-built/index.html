<title>Change Stamp Polling</title>

<style>

  --band:#14201a; --band-ink:#e9f2ec; --band-muted:#9fb5a8;

  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:7px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--sans);padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.chip[aria-current="true"] b{color:var(--green)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;min-height:400px}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0;display:grid;align-content:start;gap:12px}
.lane h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
.lane .lt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.pbtn.main{background:var(--green);border-color:var(--green);color:#fff;min-width:120px}
.bar{flex:1 1 160px;height:6px;background:var(--line);position:relative}

.note{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;background:var(--gold-soft);color:var(--gold)}

/* scene visuals */
.mock{border:1px solid var(--line);display:grid}

.mta{border:1px solid var(--line);padding:8px;color:var(--muted);font-size:13px;min-height:52px}
.mbtn{justify-self:start;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 12px}
.msec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.msec div{border:1px dashed var(--line);padding:8px;font-size:12px;color:var(--muted)}

.tw{overflow-x:auto}

.eg-bars{display:grid;gap:6px;margin-top:22px}

.eg-tick{display:flex;gap:3px;flex-wrap:wrap}
.eg-tick i{width:9px;height:18px;background:var(--red)}

.eg-levers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.eg-levers{grid-template-columns:minmax(0,1fr)}}
.eg-lv{border:1px solid var(--line);background:var(--panel);padding:10px;display:grid;gap:4px;font-size:13px}
.eg-lv b{font-size:15px}
.eg-lv small{color:var(--muted)}
.eg-lv .tag{justify-self:start}
.eg-lv.pick{border:2px solid var(--green)}
.eg-check{display:grid;gap:8px}
.eg-check div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);padding:10px;font-size:14px}
/* change-stamp deck — flow steps */
.st-flow{display:grid;gap:6px}
.st-step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:8px;font-size:13px}
.st-step i{font-style:normal;font:700 13px var(--mono);color:var(--muted);text-align:center}
.st-step code{font-family:var(--mono);font-size:11.5px}
.st-step.ok{border:2px solid var(--green)}
.st-step.hot{border:2px solid var(--red)}
.st-fork{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.st-fork{grid-template-columns:minmax(0,1fr)}}
.st-time{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px;text-align:center}
@media (max-width:560px){.st-time{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st-time div{border:1px solid var(--line);background:var(--panel);padding:8px;display:grid;gap:4px}
.st-time b{font:700 18px var(--mono)}
.st-time div.on{border:2px solid var(--green)}
.st-time div.off{opacity:.55}
@media (prefers-reduced-motion:no-preference){.lane{animation:in .35s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

      <button id="lang-en" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H9l-5 4v-4H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="13.5" font-size="8" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-weight="700">Aa</text></svg>English</button>

<script>
const NARR = {"ko": ["전송량 줄이기를 적용했습니다. 티 시트 화면 하나가 아무것도 안 바뀐 1분 동안 예전에는 약 1.2메가를 받았습니다. 지금은 약 200킬로바이트이고, SQL 0134 를 붙이면 2킬로바이트 정도로 줄어듭니다. 티 시트와 스타터 화면 두 곳을 바꿨고, Vercel 배포까지 끝났습니다.", "5초마다 하는 일은 이렇습니다. 먼저 이번 주 예약이 바뀌었는지, 32자짜리 변경 도장을 묻습니다. 지난번과 같으면 거기서 끝이고 아무것도 받지 않습니다. 대부분의 5초가 여기서 끝납니다. 도장이 다를 때만 일주일치 목록을 받아 화면을 새로 그립니다.", "하나도 놓치지 않는 이유가 있습니다. 도장은 화면이 받을 예약 목록 그 자체를 요약한 값이라서, 예약이든 선수든 결제든 무엇이 바뀌어도 달라집니다. 홀드가 시간이 지나 저절로 사라질 때도 바뀝니다. 그리고 도장을 목록보다 먼저 받기 때문에, 그 사이에 바뀐 것은 다음 5초에 다시 받습니다.", "아무도 화면을 만지지 않으면 천천히 묻습니다. 사용 중에는 5초, 2분 동안 손을 안 대면 30초 간격입니다. 다시 클릭하거나 터치하면 기다리지 않고 바로 한 번 확인합니다. 탭이 숨겨져 있으면 예전처럼 멈춥니다.", "스타터 화면도 같은 방식입니다. 15초마다 그날 예약의 도장만 묻고, 바뀌었을 때만 슬롯과 예약을 다시 읽습니다. 첫 티 시각이나 잠긴 칸은 도장에 들어가지 않아서, 5분마다 한 번은 통째로 읽습니다.", "SQL 0134 는 아직 실행 전입니다. 지금은 도장 함수가 없어서 화면이 안전하게 물러나, 티 시트는 30초마다, 스타터는 60초마다 통째로 읽습니다. 그것만으로도 약 80퍼센트가 줄었습니다. SQL 을 붙이면 도장 방식이 켜지고 약 98퍼센트까지 줄어듭니다.", "남은 일은 SQL 0134 를 Supabase SQL editor 에 붙여 한 번 실행하는 것입니다. 그다음 다른 PC 에서 예약을 바꿨을 때 5초 안에 보이는지, 하루 뒤 사용량 화면의 전송량이 하루 0.05기가 정도로 내려갔는지 확인해 주세요."], "en": ["The egress cut is in. In a minute with no changes, one tee sheet screen used to download about 1.2 megabytes. Now it's about 200 kilobytes, and once SQL 0134 is pasted it drops to around 2 kilobytes. Two screens changed, the tee sheet and the starter screen, and it's deployed on Vercel.", "Here's what happens every 5 seconds. First it asks for a 32-character change stamp for this week's bookings. If it matches last time, that's it, nothing is downloaded, and most ticks end there. Only when the stamp differs does it fetch the week and redraw the screen.", "Here's why nothing gets missed. The stamp is a digest of the exact booking list the screen would receive, so any change to a booking, player or payment changes it, and so does a hold expiring on its own. And because the stamp is fetched before the list, anything that changes in between is picked up on the next tick.", "When nobody touches the screen, it asks less often. Every 5 seconds while in use, every 30 seconds after two idle minutes. A click or touch triggers one check right away. A hidden tab still pauses, as before.", "The starter screen works the same way. Every 15 seconds it asks for that day's stamp and re-reads slots and bookings only on change. The first tee time and locked slots aren't in the stamp, so it does a full read every 5 minutes.", "SQL 0134 hasn't been run yet. Without the stamp function, screens fall back safely: the tee sheet reads everything every 30 seconds, the starter every 60. That alone cuts about 80 percent. Once the SQL is pasted, stamps turn on and the cut reaches about 98 percent.", "What's left is pasting SQL 0134 into the Supabase SQL editor once. Then check that a booking changed on another PC shows up within 5 seconds, and that a day later the usage page shows about 0.05 gigabytes of egress a day."]};
const DUR = {"ko": [19.67, 17.58, 20.24, 16.33, 13.74, 19.46, 17.97], "en": [19.49, 15.78, 17.58, 13.37, 13.61, 17.27, 15.49]};
let LANG = "ko";
try { const s = localStorage.getItem("pelham-deck-lang"); if (s === "en" || s === "ko") LANG = s; } catch (e) {}
const T = (o) => (typeof o === "string" ? o : o[LANG]);

const UI = {

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, playing = false, timer = null, startAt = 0;

function renderUI() {
  $("eyebrow").textContent = T(UI.eyebrow); $("title").textContent = T(UI.title); $("sub").textContent = T(UI.sub);
  $("who").textContent = T(UI.who); $("speedL").textContent = T(UI.speed); $("foot").textContent = T(UI.foot);
  $("play").textContent = playing ? T(UI.pause) : T(UI.play);
  $("lang-ko").setAttribute("aria-pressed", LANG === "ko"); $("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.documentElement.lang = LANG;
  $("chips").innerHTML = S.map((s, i) => `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}"><b>${i + 1}</b>${T(s.n)}</button>`).join("");
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $("stage").innerHTML = `<div class="lane"><div class="lt">${T(UI.pic)}</div><h2>${T(s.h)}</h2>${s.pic()}</div>
    <div class="lane"><div class="lt">${T(UI.keys)}</div><ul class="pts">${s.pts.map((p, k) => `<li><i>${k + 1}</i><span>${T(p)}</span></li>`).join("")}</ul></div>`;
  $("narr").textContent = NARR[LANG][cur];
  $("prog").style.width = "0";
  renderUI();
}

function stopAudio() { audio.pause(); clearInterval(timer); }
function playScene() {
  stopAudio();
  audio.src = `audio/${LANG}/s${cur + 1}.mp3`;
  audio.playbackRate = Number($("speed").value);
  const p = audio.play();
  if (p && p.catch) p.catch(() => { playing = false; renderUI(); });
  timer = setInterval(() => {
    const d = audio.duration || DUR[LANG][cur] || 1;
    $("prog").style.width = `${Math.min(100, (audio.currentTime / d) * 100)}%`;
  }, 200);
}
audio.addEventListener("ended", () => {
  clearInterval(timer); $("prog").style.width = "100%";
  if (playing && cur < S.length - 1) setTimeout(() => { if (playing) { show(cur + 1); playScene(); } }, 700);
  else { playing = false; renderUI(); }
});
$("play").onclick = () => { playing = !playing; if (playing) playScene(); else stopAudio(); renderUI(); };
$("prev").onclick = () => { show(cur - 1); if (playing) playScene(); };
$("next").onclick = () => { show(cur + 1); if (playing) playScene(); };
$("chips").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; show(Number(b.dataset.i)); if (playing) playScene(); };
$("speed").onchange = () => { audio.playbackRate = Number($("speed").value); };
function setLang(l) { LANG = l; try { localStorage.setItem("pelham-deck-lang", l); } catch (e) {} show(cur); if (playing) playScene(); }
$("lang-ko").onclick = () => setLang("ko");
$("lang-en").onclick = () => setLang("en");
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); });
show(0);
</script>
