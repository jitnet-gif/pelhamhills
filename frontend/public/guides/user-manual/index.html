<!doctype html>
<html lang="ko"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<title>Pelham Hills User Manual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one presenter column — header, scene chips, two-lane stage (picture · key points), dark narration band, player bar */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#1c2420; --muted:#5d6a62; --line:#d6ddd6;
  --green:#1a7f4b; --green-soft:#dcefe3; --gold:#b7791f; --gold-soft:#f8ecd6; --red:#b4412f;
  --band:#14201a; --band-ink:#e9f2ec; --band-muted:#9fb5a8;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#17201b; --ink:#e4ece6; --muted:#97a89d; --line:#2b3830;
  --green:#3fbf7f; --green-soft:#1d3527; --gold:#e0a64a; --gold-soft:#3a2e19; --red:#e07a66;
  --band:#08100c; --band-ink:#e9f2ec; --band-muted:#8aa395; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:7px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--sans);padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.chip[aria-current="true"] b{color:var(--green)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;min-height:400px}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0;display:grid;align-content:start;gap:12px}
.lane h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
.lane .lt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.pts li i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--green);padding-top:2px}
.band{background:var(--band);color:var(--band-ink);padding:14px 16px;min-height:96px;display:grid;gap:4px}
.band .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
.band p{margin:0;font-size:16px;line-height:1.6}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--sans);min-height:44px;min-width:44px;padding:0 14px;cursor:pointer}
.pbtn.main{background:var(--green);border-color:var(--green);color:#fff;min-width:120px}
.bar{flex:1 1 160px;height:6px;background:var(--line);position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--green);width:0}
.speed{font:500 13px var(--sans);color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;background:var(--gold-soft);color:var(--gold)}
.tag.ok{background:var(--green-soft);color:var(--green)}
/* scene visuals */
.mock{border:1px solid var(--line);display:grid}
.mock .mh{padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.mock .mb{padding:10px;display:grid;gap:8px}
.mta{border:1px solid var(--line);padding:8px;color:var(--muted);font-size:13px;min-height:52px}
.mbtn{justify-self:start;background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 12px}
.msec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.msec div{border:1px dashed var(--line);padding:8px;font-size:12px;color:var(--muted)}
.msec div b{display:block;color:var(--ink);font-size:13px}
.tw{overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;min-width:460px;font-size:13px;font-variant-numeric:tabular-nums}
table.hm th{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
table.hm th.r{text-align:left;color:var(--ink);font-size:13px;white-space:nowrap}
table.hm td{text-align:center;padding:6px 2px;font-weight:600}
table.hm td.empty{outline:2px dashed var(--gold);outline-offset:-2px}
.chart{display:grid;gap:8px}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13px}
.row .t{height:16px;background:var(--line)}
.row .t span{display:block;height:100%;background:var(--green)}
.row.hl .t span{background:var(--gold)}
.row .v{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.stack{display:flex;height:34px}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.offer{border:1px solid var(--green);background:var(--green-soft);padding:10px;display:grid;gap:4px;font-size:13px}
.offer b{font-size:14px}
.code{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:1px 6px}
.ladder{position:relative;height:210px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 4px 22px 4px}
.ladder .zone{position:absolute;top:0;bottom:0;background:var(--gold-soft)}
.ladder .zone em{position:absolute;top:4px;left:6px;font-style:normal;font-size:11px;font-weight:700;color:var(--gold)}
.ladder .pin{position:absolute;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;font-size:11px;white-space:nowrap}
.ladder .pin s{display:block;width:10px;height:10px;border-radius:50%;background:var(--green);text-decoration:none}
.ladder .pin.h s{background:var(--gold)}
.ladder .tick{position:absolute;bottom:-20px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-family:var(--mono)}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.plan{grid-template-columns:minmax(0,1fr)}}
.plan div{border:1px solid var(--line);padding:10px;display:grid;gap:6px;align-content:start;font-size:13px}
.plan h3{margin:0;font-size:14px}
.plan ul{margin:0;padding-left:18px;display:grid;gap:4px}
.check{display:grid;gap:8px}
.check div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);padding:10px;font-size:14px}
/* user manual: um- = screen mock, gc- = gift card samples, cp- = coupon book samples. Paper samples stay white in both themes. */
:root{--paper:#ffffff;--paper-ink:#111111;--paper-line:#111111;--sage:#7c9a6b;--pink:#c0266e;--pink-soft:#fbe4ef;--sky:#0284c7;--sky-soft:#dff1fb;--amber1:#b45309;--amber2:#7c3f0a;--gr1:#15803d;--gr2:#14532d;--red-soft:#f7e3df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink:#f06ba8;--pink-soft:#3b1a2b;--sky:#5cc0f0;--sky-soft:#12303f;--red-soft:#3a201b}}
:root[data-theme="dark"]{--pink:#f06ba8;--pink-soft:#3b1a2b;--sky:#5cc0f0;--sky-soft:#12303f;--red-soft:#3a201b}
.chs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ch{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--sans);padding:7px 11px;cursor:pointer;min-height:40px;white-space:nowrap}
.ch small{font:500 11px var(--mono);color:var(--muted);margin-left:4px}
.ch[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch[aria-current="true"] small{color:var(--bg)}
.pos{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.um{border:1px solid var(--line);font-size:13px;min-width:0}
.um-h{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px}
.um-h span:last-child{font:500 11px var(--mono);color:var(--muted);overflow-wrap:anywhere;text-align:right}
.um-b{padding:10px;display:grid;gap:8px;min-width:0}
.um-tabs{display:flex;flex-wrap:wrap;gap:0 2px;border-bottom:1px solid var(--line)}
.um-tabs span{padding:5px 9px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent}
.um-tabs span.on{color:var(--green);border-color:var(--green);font-weight:700}
.um-btns{display:flex;flex-wrap:wrap;gap:6px}
.um-btn{display:inline-block;border:1px solid var(--line);padding:6px 10px;font-size:12px;font-weight:600;background:var(--panel)}
.um-btn.m{background:var(--green);border-color:var(--green);color:#fff}
.um-btn.w{border-color:var(--gold);color:var(--gold)}
.um-btn.r{border-color:var(--red);color:var(--red)}
.um-f{display:grid;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
.um-f span{border:1px solid var(--line);padding:6px 8px;color:var(--ink);font-size:13px;overflow-wrap:anywhere;min-height:33px}
.um-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.um-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.um-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.um-r:last-child{border-bottom:0}
.um-r small{display:block;color:var(--muted);font-size:11.5px}
.um-r>b,.um-num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.um-pill{font-size:11px;font-weight:700;padding:2px 7px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.um-pill.g{background:var(--gold-soft);color:var(--gold)}
.um-pill.r{background:var(--red-soft);color:var(--red)}
.um-pill.n{background:var(--bg);color:var(--muted)}
.um-steps{display:grid;gap:6px;counter-reset:s}
.um-steps>div{position:relative;border:1px solid var(--line);padding:8px 10px 8px 38px;font-size:13.5px;min-width:0;counter-increment:s}
.um-steps>div::before{content:counter(s);position:absolute;left:10px;top:8px;width:20px;height:20px;background:var(--green);color:#fff;font:700 12px/20px var(--mono);text-align:center}
.um-steps small{display:block;color:var(--muted);font-size:12px}
.um-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.um-cols>div{border:1px solid var(--line);padding:10px;display:grid;gap:3px;align-content:start;font-size:13px;min-width:0}
.um-cols>div b{font-size:14px}
.um-cols small{color:var(--muted);font-size:12px}
.um-cols>div.a{border-color:var(--green);background:var(--green-soft)}
.um-cols>div.w{border-color:var(--gold);background:var(--gold-soft)}
.um-tb{border-collapse:collapse;width:100%;font-size:12.5px}
.um-tw{overflow-x:auto}
.um-tb th{text-align:left;font-size:11px;color:var(--muted);padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.um-tb td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.um-warn{background:var(--gold-soft);color:var(--ink);padding:8px 10px;font-size:13px}
.um-phone{max-width:300px;width:100%;margin:0 auto;align-content:start;align-self:start;border:8px solid var(--ink);border-radius:22px;background:var(--bg);padding:12px 10px;display:grid;gap:8px;font-size:12.5px;min-width:0}
.um-bub{background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:9px 10px;font-size:12.5px;display:grid;gap:7px}
.um-from{text-align:center;font-weight:700;font-size:12px;color:var(--muted)}
.tee{display:grid;gap:3px;font-size:12px}
.tee>div{display:grid;grid-template-columns:52px repeat(4,minmax(0,1fr));gap:3px}
.tee>div>*{padding:5px 3px;text-align:center;border:1px solid var(--line);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tee time{font-family:var(--mono);font-size:11px;border:0}
.tee .b{background:var(--green-soft);border-color:transparent}
.tee .a{background:var(--green);color:#fff;border-color:transparent}
.tee .x{background:var(--gold-soft);border-color:transparent}
.samp{font:700 10px var(--mono);letter-spacing:.08em;color:var(--red);border:1px solid var(--red);padding:1px 5px;justify-self:start;align-self:start}
/* barcodes: real Code 128, white ground so a scanner could read them */
.bc{background:#fff;padding:4px 6px;display:block}
.bc svg{display:block;width:100%;height:100%;fill:#000}
/* thermal card */
.gc-th{background:var(--paper);color:var(--paper-ink);width:100%;max-width:290px;margin:0 auto;padding:14px 14px 18px;font:12px/1.4 ui-monospace,Menlo,monospace;display:grid;gap:3px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.28);position:relative}
.gc-th img{width:82px;margin:0 auto;filter:grayscale(1)}
.gc-th .big{font-size:18px;font-weight:700;letter-spacing:.14em;margin:5px 0 1px}
.gc-th .rw{display:flex;justify-content:space-between;gap:8px;text-align:left}
.gc-th hr{border:0;border-top:1px dashed #111;width:100%;margin:5px 0}
.gc-th p{margin:0;text-align:left;font-size:11px}
.gc-th .bc{height:54px;padding:4px 0;margin-top:4px}
/* paper certificate: everything sized in cqw so it scales like the printed page */
.gc-wrap{container-type:inline-size;width:100%;box-shadow:0 1px 5px rgba(0,0,0,.28)}
.gc-cert{background:var(--paper);color:var(--paper-ink);font-family:"Times New Roman",Times,Georgia,serif;aspect-ratio:9.1/3.8;position:relative;padding:1.1cqw 2.4cqw 1.5cqw;display:grid;grid-template-columns:25.8cqw 1fr;grid-template-rows:auto 1fr;column-gap:1.6cqw;overflow:hidden}
.gc-cert .no{position:absolute;top:1.5cqw;right:2.4cqw;font-weight:700;font-size:1.65cqw}
.gc-cert h3{grid-column:1/-1;margin:0;text-align:center;font-weight:700;font-size:8.3cqw;line-height:1.05;letter-spacing:.3cqw;color:var(--sage)}
.gc-cert .cl{align-self:end;text-align:center;font-size:1.85cqw;line-height:1.15}
.gc-cert .cl img{display:block;width:24cqw;max-width:100%;margin:0 auto .4cqw}
.gc-cert .cl b{display:block;font-size:2.1cqw}
.gc-cert .ln{display:flex;flex-direction:column;gap:1.9cqw;font-size:2.2cqw;min-width:0}
.gc-cert .rw{display:flex;align-items:flex-end;gap:.9cqw}
.gc-cert .rw.in{padding-left:4.4cqw}
.gc-cert .fl{flex:1;min-width:0;border-bottom:1px solid var(--paper-line);padding:0 .9cqw 1px;font-size:2.5cqw;font-weight:700;white-space:nowrap;overflow:hidden;min-height:1.35em}
.gc-cert .fl small{font-size:1.6cqw;font-weight:400}
.gc-cert .fl.s{flex:0 0 21cqw}.gc-cert .fl.e{flex:0 0 16.5cqw;font-size:2.05cqw}
.gc-cert .cash{margin:-1.9cqw 0 0;text-align:right;font-size:1.1cqw}
.gc-cert .ft{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
.gc-cert .bars{width:28.5cqw}
.gc-cert .bars .bc{height:4.9cqw;padding:0}
.gc-cert .bars p{margin:0;text-align:center;font:1.3cqw ui-monospace,Menlo,monospace;letter-spacing:.1cqw}
.gc-cert .web{font-size:2.5cqw}
/* app wallet */
.gc-wal{display:grid;gap:1px;color:#fff;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--gr1),var(--gr2))}
.gc-wal.cp{background:linear-gradient(135deg,var(--amber1),var(--amber2))}
.gc-wal .t{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
.gc-wal .a{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.gc-wal .s{font-size:11.5px;opacity:.92}
.gc-wal .c{font:10.5px var(--mono);opacity:.85;margin-top:3px;overflow-wrap:anywhere}
.gc-bar{background:#fff;color:#000;display:grid;gap:7px;justify-items:center;padding:14px 10px;text-align:center;font-size:11.5px}
.gc-bar .bc{height:62px;width:100%}
.gc-bar b{font-size:14px}.gc-bar code{font:13px var(--mono);letter-spacing:.08em}
/* coupon book */
.cp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:9px}
.cp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cp-c{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted);overflow:hidden;min-width:0}
.cp-c.on{border:2px solid var(--green);background:#fff;padding:1px}
.cp-c.on img{width:100%;height:100%;object-fit:contain}
.cp-c.gift{border-color:var(--green);color:var(--green)}
.cp-c svg{width:58%;height:58%}
.cp-ban{display:grid;gap:1px;border:2px solid var(--green);background:var(--green-soft);border-radius:12px;padding:9px 11px}
.cp-ban.s{border-color:var(--sky);background:var(--sky-soft)}
.cp-ban.p{border-color:var(--pink);background:var(--pink-soft)}
.cp-ban b{font-size:13.5px}.cp-ban small{font-size:11.5px;color:var(--muted)}
.cp-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.cp-bar i{display:block;height:100%;background:var(--pink)}
.cp-code{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 11px}
.cp-code b{font:700 18px var(--mono);letter-spacing:.14em}
.cp-code small{color:var(--muted);font-size:11px;display:block}
.cp-mut{color:var(--muted);font-size:11.5px}
@media (max-width:480px){.um-g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.lane{animation:in .3s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
    </div>

  () => `<div style="display:grid;gap:8px">${SAMP()}${win("Email", "", `<small style="color:var(--muted)">Subject</small><b>Your Pelham Hills gift certificate — $100.00</b>${cert()}<small>Show the barcode in this email (on your phone or printed) at the counter. Not redeemable for cash. Anyone with this barcode can spend it, so keep it to yourself.</small>`)}${phone(`<div class="um-from">Text · MMS</div>${bub(`<span class="bc" style="height:58px">${BARS[GIFT]}</span><span>Pelham Hills gift card for Jordan Lee: $100.00 to spend on green fees, the pro shop and the snack bar. Show this barcode at the counter. Card ${GIFT}. Expires Dec 31, 2027, not redeemable for cash. Anyone with this barcode can spend it, so keep it to yourself. Questions? Call ${NUM()}.</span>`)}`)}</div>`,
  [["<b>Send message</b>: 바코드 문자", "<b>Send message</b>: Barcode by text"], ["<b>Send email</b>: 상품권 양식 메일", "<b>Send email</b>: Certificate by email"], ["발행 때 번호나 메일을 넣으면 자동으로 나갑니다", "Entering them when issuing sends automatically"], ["잔액이 $0이거나 만료된 무료 카드는 보낼 수 없습니다", "Disabled at $0, or on an expired complimentary card"], ["받은 분은 화면을 보여 주기만 하면 됩니다", "Guests just show the screen"]],
  "기프트카드는 휴대폰으로도 보낼 수 있습니다. 센드 메시지는 바코드 사진이 든 문자를, 센드 이메일은 상품권 양식 메일을 보냅니다. 받으신 분은 화면의 바코드를 계산대에서 보여 주기만 하면 됩니다. 잔액이 없거나 기한이 지난 무료 카드는 단추가 꺼져 있습니다.",
  "Gift cards can also go to a phone. Send message sends a text with the barcode image, and Send email sends the certificate. The guest just shows the barcode at the counter. The buttons are turned off when the balance is zero, or on an expired complimentary card.");
add("gift-redeem", ["계산대에서 쓰기", "Redeeming"], ["바코드를 찍으면 계산서에서 빠집니다", "Scan the barcode and it comes off the bill"],
  () => `<div class="um-g2">${win("Bill", "", `${rw("Green fee · Jordan Lee", num("$60.00"))}${rw("HST 13%", num("$7.80"))}${rw("<b>Total</b>", num("$67.80"))}${fld("Gift card number", GIFT)}${rw(`Gift card ${pill("−$67.80")}`, num("$0.00"))}`)}${win(L("카드 잔액", "Card balance"), "", `${rw("Value", num("$100.00"))}${rw("Used", num("−$67.80"))}${rw("<b>Balance</b>", num("$32.20"))}<small style="color:var(--muted)">${L("남은 금액은 카드에 그대로", "The rest stays on the card")}</small>`)}</div>`,
  [["티시트, Pro Shop, Snack Bar <b>모든 계산서</b>에서 쓸 수 있습니다", "Works on <b>every bill</b>: tee sheet, pro shop and snack bar"], ["발행 권한 없이 <b>캐셔 누구나</b> 사용 처리", "<b>Any cashier</b> can redeem one"], ["잔액이 모자라면 나머지는 다른 수단으로", "If it falls short, pay the rest another way"], ["잔액보다 많이 쓸 수 없고, 팁은 안 됩니다", "You can't exceed the balance, and tips can't use it"], ["문자, 종이, 지갑 바코드 모두 같습니다", "Text, paper and wallet barcodes all work the same"]],
  "손님이 기프트카드를 내면 결제 수단에서 기프트 카드를 고르고 바코드를 찍으세요. 티시트든 프로샵이든 스낵바든 모든 계산서에서 됩니다. 금액이 남으면 카드에 그대로 남고, 모자라면 나머지를 다른 수단으로 받습니다. 예를 들어 백 달러 카드로 육십칠 달러 팔십 센트를 내면 삼십이 달러 이십 센트가 남습니다. 팁은 기프트카드로 낼 수 없습니다.",
  "When a guest pays by gift card, choose Gift card and scan the barcode. It works on every bill: tee sheet, pro shop and snack bar. Any amount left stays on the card, and if the card falls short, take the rest another way. For example, a hundred dollar card used on sixty-seven eighty leaves thirty-two twenty. Tips can't go on a gift card.");
add("gift-rules", ["만료·무효·목록", "Expiry, void, list"], ["판매 카드와 무료 카드는 만료 규칙이 다릅니다", "Sold and complimentary cards expire differently"],
  () => `${table([["", ""], ["판매 Sold", "Sold"], ["무료 Complimentary", "Complimentary"]], [[["만료일 지남", "Past the date"], ["<b>계속 사용 가능</b> (온타리오법)", "<b>Keeps working</b> (Ontario law)"], ["사용 거절, 당일까지는 사용 가능", "Refused, but works through the day itself"]], [["기본 만료일", "Default expiry"], ["2027-12-31", "2027-12-31"], ["2027-12-31", "2027-12-31"]]])}${win("Gift Cards", "/admin/gift-cards", `${rw("Jordan Lee · " + GIFT, pill("Active"), "$32.20 of $100.00")}${rw("Sam Park · GIFT-9C0D7E5F21", pill("Used up", "n"), "$0.00 of $50.00")}${rw("Prize · GIFT-44B1A0C9E7", pill("Expired", "g"), "$25.00")}${rw("Error · GIFT-0E6F2D13AA", pill("Void", "r"), "$0.00")}${btns(btn("Barcode &amp; history"), btn("Reprint"), btn("Certificate"), btn("Void", "r"))}`)}`,
  [["맨 위에 카드 수, 잔액 있는 카드, <b>Outstanding</b> 합계", "Top line: cards, cards with a balance, <b>Outstanding</b>"], ["검색은 카드 번호, 이름, 전화, 사유", "Search by card number, name, phone or reason"], ["만료일을 비우면 No expiry. <b>Barcode & history</b> 안에서 수정", "Clear the date for No expiry. Edit inside <b>Barcode & history</b>"], ["<b>Void는 되돌릴 수 없습니다</b>", "<b>Void can't be undone</b>"], ["환불되면 금액이 카드로 돌아옵니다", "Refunds put the money back on the card"]],
  "만료 규칙은 꼭 기억해 주세요. 돈을 내고 산 카드는 온타리오법에 따라 날짜가 지나도 계속 쓸 수 있습니다. 거절되는 것은 무료로 준 카드뿐이고, 만료일 당일까지는 쓸 수 있어요. 목록에서 잔액과 사용 내역을 볼 수 있습니다. 보이드는 되돌릴 수 없으니 이유를 확인하고 누르세요.",
  "Please remember the expiry rule. Under Ontario law, a card someone paid for keeps working after the date. Only complimentary cards are refused, and they still work through the expiry day itself. The list shows balances and history. Void can't be undone, so be sure before you press it.");
add("gift-wallet", ["샘플: 앱 지갑", "Sample: app wallet"], ["GPS 앱 지갑에 담긴 기프트카드", "The gift card in the GPS app wallet"],
  () => g2(`<div style="display:grid;gap:6px">${SAMP()}${phone(`<div class="um-from">My wallet</div>${wallet("", "Gift card", "$32.20", "of $100.00 · No expiry", GIFT)}`)}</div>`, `<div style="display:grid;gap:6px"><span class="samp" style="visibility:hidden">.</span>${phone(`<div class="gc-bar"><b>Gift card · $32.20 left</b>${bar(GIFT)}<code>${GIFT}</code><span>Show this at the pro shop. Turn your screen brightness up if the scanner misses. Anyone with this barcode can spend the card - keep it to yourself.</span></div>`)}</div>`),
  [["GPS 관리 화면의 <b>쿠폰·기프트카드</b> 탭에서 손님 계정으로 발행", "Issued to a guest account from the GPS admin <b>쿠폰·기프트카드</b> tab"], ["손님은 카드를 눌러 바코드를 띄웁니다", "The guest taps the card to show the barcode"], ["스캐너가 못 읽으면 화면 밝기를 올립니다", "If the scanner misses, turn the brightness up"], ["지갑 카드는 만료일이 있어도 현재 <b>No expiry</b>로 보입니다. 날짜는 문자나 상품권을 확인하세요", "The wallet currently shows <b>No expiry</b> even when a date is set. Check the text or certificate for it"]],
  "매니저가 지피에스 관리 화면에서 손님 계정으로 발행하면 기프트카드가 앱 지갑에 들어갑니다. 초록색 카드를 누르면 흰 화면에 큰 바코드가 뜨고, 이것을 계산대에서 찍습니다. 스캐너가 잘 못 읽으면 화면 밝기를 올려 달라고 안내하세요. 다만 지금 지갑 화면은 만료일이 있어도 노 익스파이어리로 보입니다.",
  "When a manager issues a card to a guest account from the GPS admin screen, it appears in the app wallet. Tapping the green card shows a large barcode on a white screen to scan at the counter. If the scanner misses, ask the guest to turn up the brightness. Note that for now the wallet shows No expiry even when the card has a date.");

add("cp-book", ["샘플: 쿠폰북", "Sample: coupon book"], ["10번 치면 1번 무료", "Play 10 rounds, get 1 free"],
  () => `<div style="display:grid;gap:8px">${SAMP()}<div class="um-phone" style="max-width:340px"><div class="um-from">My wallet · Coupon book</div>${codeBox()}<div class="cp-card">${stamps(7)}<span class="cp-mut">3 more rounds to your next free round.</span><span class="cp-mut">Stamped today ✓</span></div></div></div>`,
  [["도장은 클럽 <b>로고</b>, 가로 5 × 세로 2칸", "Stamps are the club <b>logo</b>, in a 5 × 2 grid"], ["10번째 칸은 선물 그림. 채워지는 대신 카드가 비워지고 무료 라운드가 생깁니다", "Cell 10 is a gift icon. It never fills: the card resets and a free round appears"], ["<b>회원은 참여하지 않습니다</b>", "<b>Members don't collect stamps</b>"], ["앱 첫 화면의 <b>Coupon book</b> 타일", "Find it under the <b>Coupon book</b> tile on the app home"]],
  "이것이 지피에스 앱의 쿠폰북입니다. 라운드를 할 때마다 클럽 로고 도장이 하나씩 찍혀요. 샘플은 일곱 개가 찍혀서 세 번 남았다고 나옵니다. 열 번째 도장을 받으면 카드가 비워지고 무료 라운드 한 번이 생깁니다. 회원분은 멤버십으로 치시기 때문에 도장을 모으지 않습니다.",
  "This is the coupon book in the GPS app. Each round adds one club logo stamp. This sample has seven, so it says three more rounds to go. The tenth stamp resets the card and gives one free round. Members play on their membership, so they don't collect stamps.");

add("cp-free", ["샘플: 무료 라운드", "Sample: free round"], ["무료 라운드는 티시트 계산서에서 씁니다", "Free rounds are used on the tee sheet bill"],

  "무료 라운드가 생기면 앱에 초록색 안내가 뜹니다. 손님이 체크인할 때 말씀하시면, 티시트 계산서에 프리 라운드 레디 표시가 보입니다. 유즈 프리 라운드를 누르면 그분의 그린피만 영 달러가 되고, 카트 요금은 그대로 받습니다. 잘못 눌렀다면 언두를 누르세요. 무료 라운드가 다시 돌아옵니다.",

  "라운드 백 번마다 기념품을 드립니다. 도장 수에 사용한 무료 라운드 수를 더해서 셉니다. 때가 되면 앱에 분홍색 안내가 뜨고, 계산서에 수브니어 듀 표시가 나옵니다. 기념품을 건네고 게이브 수브니어를 눌러 주세요.",

  () => table([["화면", "Screen"], ["상태", "Status"]], [
    ["Dynamic Pricing", pill(L("샘플, 저장 안 됨", "Sample, not saved"), "g")], ["Events", pill(L("샘플, 저장 안 됨", "Sample, not saved"), "g")], ["Tour Operators", pill(L("샘플, 저장 안 됨", "Sample, not saved"), "g")], ["Settings", pill(L("샘플, 이 브라우저에서만", "Sample, this browser only"), "g")], [["Integrations 표", "Integrations table"], pill(L("샘플", "Sample"), "g")], ["Tee Times & Pricing", pill(L("읽기 전용", "Read-only"), "n")], ["Course Map · CCTV", pill(L("GPS 앱으로 이동", "Opens in the GPS app"), "n")],

const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, playing = false, timer = null;

function renderUI() {
  const c = S[cur].ch;
  $("eyebrow").textContent = T(UI.eyebrow); $("title").textContent = T(UI.title); $("sub").textContent = T(UI.sub);
  $("who").textContent = T(UI.who); $("speedL").textContent = T(UI.speed); $("foot").textContent = T(UI.foot);
  $("play").textContent = playing ? T(UI.pause) : T(UI.play);
  $("pos").textContent = `${cur + 1} / ${S.length}`;
  $("lang-ko").setAttribute("aria-pressed", LANG === "ko"); $("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.documentElement.lang = LANG;
  $("chs").innerHTML = CH.map((x, i) => `<button class="ch" type="button" data-c="${i}" aria-current="${i === c}">${i + 1}. ${T(x.n)}<small>${S.filter((s) => s.ch === i).length}</small></button>`).join("");
  $("chips").innerHTML = S.map((s, i) => s.ch === c ? `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}"><b>${i + 1}</b>${T(s.n)}</button>` : "").join("");
  const on = $("chs").querySelector('[aria-current="true"]');
  if (on) $("chs").scrollLeft = on.offsetLeft - $("chs").offsetLeft - 40;
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $("stage").innerHTML = `<div class="lane"><div class="lt">${T(CH[s.ch].n)}</div><h2>${T(s.h)}</h2>${s.pic()}</div>
    <div class="lane"><div class="lt">${T(UI.keys)}</div><ul class="pts">${s.pts.map((p, k) => `<li><i>${k + 1}</i><span>${T(p)}</span></li>`).join("")}</ul></div>`;
  $("narr").textContent = T(s.say);
  $("prog").style.width = "0";
  try { history.replaceState(null, "", `#${s.id}`); } catch (e) {}
  renderUI();
}

function stopAudio() { audio.pause(); clearInterval(timer); }
function playScene() {
  stopAudio();
  audio.src = `audio/${LANG}/${S[cur].id}.mp3`;
  audio.playbackRate = Number($("speed").value);
  const p = audio.play();
  if (p && p.catch) p.catch(() => { playing = false; renderUI(); });
  timer = setInterval(() => {
    const d = audio.duration || 1;
    $("prog").style.width = `${Math.min(100, (audio.currentTime / d) * 100)}%`;
  }, 200);
}
audio.addEventListener("ended", () => {
  clearInterval(timer); $("prog").style.width = "100%";
  if (playing && cur < S.length - 1) setTimeout(() => { if (playing) { show(cur + 1); playScene(); } }, 700);
  else { playing = false; renderUI(); }
});
const go = (i) => { show(i); if (playing) playScene(); };
$("play").onclick = () => { playing = !playing; if (playing) playScene(); else stopAudio(); renderUI(); };
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("chips").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (b) go(Number(b.dataset.i)); };
$("chs").onclick = (e) => { const b = e.target.closest("button[data-c]"); if (b) go(S.findIndex((s) => s.ch === Number(b.dataset.c))); };
$("speed").onchange = () => { audio.playbackRate = Number($("speed").value); };
function setLang(l) { LANG = l; try { localStorage.setItem("pelham-deck-lang", l); } catch (e) {} show(cur); if (playing) playScene(); }
$("lang-ko").onclick = () => setLang("ko");
$("lang-en").onclick = () => setLang("en");
document.addEventListener("keydown", (e) => { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); });
const fromHash = S.findIndex((s) => `#${s.id}` === location.hash);
show(fromHash < 0 ? 0 : fromHash);
</script>
